<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haberler — ekoloji-izleme.com</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.page-header{background:var(--forest);padding:100px 80px 60px;border-bottom:1px solid rgba(45,158,107,.15);}
.page-header-inner{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:end;}
.page-header h1{font-family:"Bebas Neue",sans-serif;font-size:clamp(48px,6vw,80px);color:var(--white);line-height:.9;margin-top:12px;}
.page-header h1 span{color:var(--bright);}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.filter-btn{font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.08em;padding:6px 12px;border-radius:2px;border:1px solid rgba(45,158,107,.25);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;text-transform:uppercase;}
.filter-btn:hover,.filter-btn.aktif{background:rgba(45,158,107,.15);border-color:var(--accent);color:var(--bright);}
/* İçerik türü butonları — farklı renk vurgular */
.filter-btn[data-icerik="rapor"]:hover,
.filter-btn[data-icerik="rapor"].aktif   {background:rgba(34,197,94,.12);border-color:#22c55e;color:#22c55e;}
.filter-btn[data-icerik="kose"]:hover,
.filter-btn[data-icerik="kose"].aktif    {background:rgba(245,158,11,.12);border-color:#f59e0b;color:#f59e0b;}
.filter-btn[data-icerik="uluslararasi"]:hover,
.filter-btn[data-icerik="uluslararasi"].aktif{background:rgba(168,85,247,.12);border-color:#a855f7;color:#a855f7;}
.filter-sep{width:1px;height:22px;background:rgba(45,158,107,.2);margin:0 2px;flex-shrink:0;}
.search-box{font-family:"JetBrains Mono",monospace;font-size:11px;padding:8px 14px;background:rgba(45,158,107,.07);border:1px solid rgba(45,158,107,.2);border-radius:3px;color:var(--cream);outline:none;width:220px;}
.search-box:focus{border-color:var(--accent);}
.scan-bar{background:var(--dark);padding:16px 80px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(45,158,107,.1);flex-wrap:wrap;}
.scan-status{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);flex:1;}
/* Koleksiyon sayaçları */
.koleksiyon-bar{background:var(--dark);padding:10px 80px;border-bottom:1px solid rgba(45,158,107,.07);display:flex;gap:20px;flex-wrap:wrap;}
.kol-chip{font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--muted);letter-spacing:.06em;cursor:pointer;padding:3px 8px;border-radius:2px;border:1px solid transparent;transition:all .2s;}
.kol-chip:hover{border-color:rgba(45,158,107,.2);}
.kol-chip b{font-weight:600;}
.kol-chip.aktif-kol{border-color:rgba(45,158,107,.3);background:rgba(45,158,107,.06);}
.kol-chip[data-kol="raporlar"]       b{color:#22c55e;}
.kol-chip[data-kol="makaleler"]      b{color:#f59e0b;}
.kol-chip[data-kol="uluslararasi"]   b{color:#a855f7;}
.kol-chip[data-kol="haberler"]       b{color:var(--accent);}
.btn-tara,.btn-import,.btn-dup{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-radius:3px;cursor:pointer;transition:all .2s;}
.btn-tara{background:var(--accent);color:var(--dark);border:none;}
.btn-tara:hover{background:var(--bright);}
.btn-tara:disabled{opacity:.5;cursor:not-allowed;}
.btn-import{background:transparent;color:var(--accent);border:1px solid rgba(45,158,107,.35);}
.btn-import:hover{background:rgba(45,158,107,.1);}
.btn-dup{background:transparent;color:var(--muted);border:1px solid rgba(45,158,107,.2);}
.btn-dup:hover{color:var(--warn);border-color:rgba(232,92,42,.4);}
.content{background:var(--dark);padding:50px 80px;min-height:60vh;}
.haber-grid{display:flex;flex-direction:column;gap:2px;}
.haber-kart{background:var(--forest);padding:22px 28px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start;cursor:pointer;border-left:3px solid transparent;transition:all .2s;}
.haber-kart:hover{background:var(--deep);padding-left:34px;}
.haber-kart[data-icerik="haber"]:hover          {border-left-color:var(--accent);}
.haber-kart[data-icerik="rapor"]:hover           {border-left-color:#22c55e;}
.haber-kart[data-icerik="kose"]:hover            {border-left-color:#f59e0b;}
.haber-kart[data-icerik="uluslararasi"]:hover    {border-left-color:#a855f7;}
.haber-kart h3{font-size:16px;font-weight:400;color:var(--cream);line-height:1.5;margin-bottom:7px;}
.haber-kart-meta{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.haber-kart-meta span{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--muted);}
.haber-kart-meta a{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--accent);text-decoration:none;}
.haber-kart-meta a:hover{color:var(--bright);}
.badge{font-family:"JetBrains Mono",monospace;font-size:8.5px;padding:3px 8px;border-radius:2px;white-space:nowrap;height:fit-content;}
.badge-haber        {background:rgba(45,158,107,.12);color:var(--accent);border:1px solid rgba(45,158,107,.2);}
.badge-rapor        {background:rgba(34,197,94,.1);color:#22c55e;border:1px solid rgba(34,197,94,.2);}
.badge-kose         {background:rgba(245,158,11,.1);color:#f59e0b;border:1px solid rgba(245,158,11,.2);}
.badge-uluslararasi {background:rgba(168,85,247,.1);color:#a855f7;border:1px solid rgba(168,85,247,.2);}
.badge-en           {background:rgba(99,102,241,.1);color:#818cf8;border:1px solid rgba(99,102,241,.2);font-size:8px;}
.admin-btn-group{display:flex;gap:5px;flex-shrink:0;}
.admin-sil-btn{padding:3px 10px;background:rgba(232,92,42,.12);color:#e85c2a;border:1px solid rgba(232,92,42,.3);border-radius:2px;font-family:"JetBrains Mono",monospace;font-size:8.5px;cursor:pointer;}
.admin-sil-btn:hover{background:rgba(232,92,42,.25);}
.admin-duzenle-btn{padding:3px 10px;background:rgba(45,158,107,.1);color:var(--bright);border:1px solid rgba(45,158,107,.3);border-radius:2px;font-family:"JetBrains Mono",monospace;font-size:8.5px;cursor:pointer;}
.admin-duzenle-btn:hover{background:rgba(45,158,107,.2);}
.empty{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);text-align:center;padding:60px 0;}

/* ─── Modal ─── */
.modal-bg{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.modal-box{background:var(--deep);border:1px solid rgba(45,158,107,.25);border-radius:8px;max-width:700px;width:100%;max-height:88vh;overflow-y:auto;}
.modal-header{padding:24px 32px 12px;display:flex;justify-content:space-between;align-items:start;gap:12px;position:sticky;top:0;background:var(--deep);z-index:1;border-bottom:1px solid rgba(45,158,107,.1);}
.modal-body{padding:20px 32px 32px;}
.modal-title{font-family:"Crimson Pro",serif;font-size:26px;font-weight:400;color:var(--cream);line-height:1.35;margin:8px 0 12px;}
.modal-meta{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:18px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);}
.modal-ozet{font-size:15px;font-weight:300;color:var(--cream);line-height:1.75;margin-bottom:24px;}
.modal-kaynak-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;background:var(--accent);color:var(--dark);font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-radius:4px;}
.modal-kaynak-btn:hover{background:var(--bright);}
.modal-close{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;}
.modal-close:hover{color:var(--cream);}

/* ─── Düzenle Modal ─── */
.edit-field{margin-bottom:14px;}
.edit-field label{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:5px;}
.edit-field input,.edit-field textarea,.edit-field select{width:100%;box-sizing:border-box;background:var(--forest);border:1px solid rgba(45,158,107,.2);border-radius:3px;padding:9px 12px;color:var(--cream);font-family:"JetBrains Mono",monospace;font-size:11px;outline:none;}
.edit-field input:focus,.edit-field textarea:focus{border-color:var(--accent);}
.edit-field textarea{resize:vertical;line-height:1.6;}
.edit-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}
.btn-kaydet{padding:10px 22px;background:var(--accent);color:var(--dark);border:none;border-radius:3px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;}
.btn-kaydet:hover{background:var(--bright);}
.btn-iptal{padding:10px 18px;background:transparent;color:var(--muted);border:1px solid rgba(45,158,107,.2);border-radius:3px;font-family:"JetBrains Mono",monospace;font-size:10px;cursor:pointer;}
.btn-iptal:hover{color:var(--cream);}

/* ─── Import Modal ─── */
.import-drop{border:2px dashed rgba(45,158,107,.3);border-radius:6px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px;}
.import-drop:hover,.import-drop.dragover{border-color:var(--accent);background:rgba(45,158,107,.05);}
.import-drop p{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted);margin:0;}
.import-drop b{color:var(--bright);display:block;font-size:14px;margin-bottom:8px;}
.import-log{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);background:rgba(0,0,0,.3);padding:12px;border-radius:3px;min-height:40px;white-space:pre-wrap;}

@media(max-width:900px){
  .page-header{padding:80px 28px 40px;}.page-header-inner{grid-template-columns:1fr;}
  .scan-bar,.koleksiyon-bar{padding:14px 28px;}.content{padding:30px 28px;}
}
</style>
</head>

<div class="page-header">

<!-- ══ Detay Modal ══ -->
<div id="detailModal" class="modal-bg" style="display:none;">

      <div id="mBadgeRow" style="display:flex;flex-wrap:wrap;gap:5px;"></div>

      <h2 class="modal-title" id="mTitle"></h2>

<!-- ══ Düzenle Modal ══ -->
<div id="editModal" class="modal-bg" style="display:none;">

          <option value="STK Raporu">STK Raporu</option>
          <option value="İklim Raporu">İklim Raporu</option>

<!-- ══ Import Modal ══ -->
<div id="importModal" class="modal-bg" style="display:none;">
  <div class="modal-box" style="max-width:500px;">
    <div class="modal-header">
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);">JSON / GeoJSON İçe Aktar</span>
      <button class="modal-close" id="importClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="import-drop" id="importDrop">
        <b>📂 Dosya sürükle veya tıkla</b>
        <p>haberler.json, data.json veya GeoJSON dosyası</p>
        <input type="file" id="importFile" accept=".json,.geojson" style="display:none;">
      </div>

        <button class="btn-iptal" id="importIptal">Kapat</button>

<script>
/* ═══════════════════════════════════════════════════════════════
   YAPILANDIRMA
═══════════════════════════════════════════════════════════════ */
const HABERLER_URL = "https://raw.githubusercontent.com/ipapila/ekoloji-izleme.com/main/haberler.json";

// İçerik türü → görsel stil
const ICERIK_STIL = {
  haber:        { badgeClass: "badge-haber",        label: "Haber"          },
  rapor:        { badgeClass: "badge-rapor",         label: "Rapor & Analiz" },
  kose:         { badgeClass: "badge-kose",          label: "Köşe & Yorum"   },
  uluslararasi: { badgeClass: "badge-uluslararasi",  label: "Uluslararası"   },
};

/* ═══════════════════════════════════════════════════════════════
   DURUM
═══════════════════════════════════════════════════════════════ */
const _adminMod = {
  keys: { ihlaller:"ekoloji_ihlal_silinen", haberler:"ekoloji_haber_silinen", raporlar:"ekoloji_rapor_silinen" },
  getSilinen(col) {
    try { return new Set(JSON.parse(localStorage.getItem(this.keys[col]||col) || "[]").map(String)); }
    catch { return new Set(); }
  },
  sil(col, id, onSuccess) {
    if (!confirm("Bu kaydı silmek istiyor musunuz?")) return;
    const sid = String(id);
    if (typeof SITE !== "undefined") SITE.set(col, SITE.getList(col).filter(x => String(x.id) !== sid));
    const key = this.keys[col] || col;
    const s = this.getSilinen(col); s.add(sid);
    localStorage.setItem(key, JSON.stringify([...s]));
    if (onSuccess) onSuccess(sid);
  }
};

let tumHaberler   = [];   // birleşik tüm kayıtlar
let gorunenHaberler = [];
let aktifKategori   = "";
let aktifIcerikTipi = "";  // ""|"haber"|"rapor"|"kose"|"uluslararasi"
let aktifKoleksiyon = "";  // ""|"haberler"|"raporlar"|"makaleler"|"uluslararasi"
let duzenleId = null;
let importData = null;

/* ═══════════════════════════════════════════════════════════════
   DETAY MODAL
═══════════════════════════════════════════════════════════════ */
function acModal(idx) {
  const h = gorunenHaberler[idx];
  if (!h) return;
  const tarih = h.tarih ? new Date(h.tarih).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}) : "";
  const domain = h.url ? (() => { try { return new URL(h.url).hostname.replace("www.",""); } catch(e){ return ""; } })() : "";
  const icerik = h.icerik_tipi || "haber";
  const stil   = ICERIK_STIL[icerik] || ICERIK_STIL.haber;

  // Badge satırı
  const badgeRow = document.getElementById("mBadgeRow");
  badgeRow.innerHTML = "";
  // İçerik türü badge
  const tipBadge = document.createElement("span");
  tipBadge.className = "badge " + stil.badgeClass;
  tipBadge.textContent = stil.label;
  badgeRow.appendChild(tipBadge);
  // EN dil badge
  if (h.dil === "en") {
    const enBadge = document.createElement("span");
    enBadge.className = "badge badge-en";
    enBadge.textContent = "EN";
    badgeRow.appendChild(enBadge);
  }
  // Kategori badge
  const cats = [h.kategori, h.etiket].filter(Boolean);
  [...new Set(cats)].forEach(c => {
    const s = document.createElement("span");
    s.className = "badge badge-haber"; s.textContent = c; badgeRow.appendChild(s);
  });
  if (h.eylem) {
    const s = document.createElement("span");
    s.style.cssText = "font-family:'JetBrains Mono',monospace;font-size:8px;padding:3px 8px;border-radius:2px;background:rgba(240,165,0,.12);color:#f0a500;border:1px solid rgba(240,165,0,.25);";
    s.textContent = h.eylem; badgeRow.appendChild(s);
  }

  const foto = document.getElementById("mFoto");
  if (h.foto_url) { foto.src = h.foto_url; foto.style.display = "block"; foto.onerror = () => foto.style.display = "none"; }
  else { foto.style.display = "none"; }

  document.getElementById("mTitle").textContent = h.baslik;
  document.getElementById("mMeta").innerHTML =
    (h.kaynak ? `<span>📰 ${h.kaynak}</span>` : "") +
    (tarih    ? `<span>📅 ${tarih}</span>` : "") +
    (domain   ? `<span>🔗 ${domain}</span>` : "");

  const et = document.getElementById("mEtiketler");
  const etiketler = Array.isArray(h.etiketler) ? h.etiketler : [];
  if (etiketler.length) {
    et.style.display = "flex";
    et.innerHTML = etiketler.map(e =>
      `<span style="font-family:'JetBrains Mono',monospace;font-size:8px;padding:2px 8px;border-radius:2px;background:rgba(45,158,107,.1);border:1px solid rgba(45,158,107,.2);color:#4db888;">${e}</span>`
    ).join("");
  } else { et.style.display = "none"; et.innerHTML = ""; }

  document.getElementById("mOzet").textContent = h.ozet || "Özet yok. Kaynağa gidin.";
  const link = document.getElementById("mLink");
  if (h.url) {
    link.href = h.url;
    link.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> Kaynağa Git — ${domain}`;
    link.style.display = "inline-flex";
  } else { link.style.display = "none"; }
  document.getElementById("detailModal").style.display = "flex";
}

/* ═══════════════════════════════════════════════════════════════
   DÜZENLE MODAL
═══════════════════════════════════════════════════════════════ */
function acDuzenle(id, event) {
  event.stopPropagation();
  const h = tumHaberler.find(x => String(x.id) === String(id));
  if (!h) return;
  duzenleId = id;
  document.getElementById("edit_baslik").value   = h.baslik || "";
  document.getElementById("edit_kaynak").value   = h.kaynak || "";
  document.getElementById("edit_kategori").value = h.kategori || h.etiket || "Haber";
  document.getElementById("edit_tarih").value    = h.tarih ? h.tarih.slice(0,10) : "";
  document.getElementById("edit_url").value      = h.url || "";
  document.getElementById("edit_ozet").value     = h.ozet || "";
  document.getElementById("editModal").style.display = "flex";
}

function duzenleKaydet() {
  if (!duzenleId) return;
  const idx = tumHaberler.findIndex(x => String(x.id) === String(duzenleId));
  if (idx === -1) return;
  tumHaberler[idx] = {
    ...tumHaberler[idx],
    baslik:   document.getElementById("edit_baslik").value.trim(),
    kaynak:   document.getElementById("edit_kaynak").value.trim(),
    kategori: document.getElementById("edit_kategori").value,
    etiket:   document.getElementById("edit_kategori").value,
    tarih:    document.getElementById("edit_tarih").value,
    url:      document.getElementById("edit_url").value.trim(),
    ozet:     document.getElementById("edit_ozet").value.trim(),
  };
  if (typeof SITE !== "undefined") {
    const localList = SITE.getList("haberler");
    const li = localList.findIndex(x => String(x.id) === String(duzenleId));
    if (li >= 0) localList[li] = tumHaberler[idx]; else localList.unshift(tumHaberler[idx]);
    SITE.set("haberler", localList);
  }
  document.getElementById("editModal").style.display = "none";
  filtrele();
  gosterBildirim("✓ Haber güncellendi.");
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════════════ */
function render(liste) {
  gorunenHaberler = liste;
  const grid = document.getElementById("haberGrid");
  if (!liste.length) { grid.innerHTML = '<div class="empty">Haber bulunamadı.</div>'; return; }
  const adminMod = typeof SITE !== "undefined" && SITE.isAdmin();
  grid.innerHTML = liste.map((h, i) => {
    const tarih  = h.tarih ? new Date(h.tarih).toLocaleDateString("tr-TR",{day:"numeric",month:"short",year:"numeric"}) : "";
    const domain = h.url ? (() => { try { return new URL(h.url).hostname.replace("www.",""); } catch(e){ return ""; } })() : "";
    const icerik = h.icerik_tipi || "haber";
    const stil   = ICERIK_STIL[icerik] || ICERIK_STIL.haber;
    const enBadge = h.dil === "en" ? `<span class="badge badge-en">EN</span>` : "";
    const adminBtnler = adminMod ? `
      <div class="admin-btn-group" onclick="event.stopPropagation()">
        <button class="admin-duzenle-btn" onclick="acDuzenle('${h.id}', event)">DÜZENLE</button>
        <button class="admin-sil-btn" onclick="haberSil('${h.id}')">SİL</button>
      </div>` : "";
    return `<div class="haber-kart" data-icerik="${icerik}" onclick="acModal(${i})">
      <div>
        <h3>${h.baslik}</h3>
        <div class="haber-kart-meta">
          <span>📰 ${h.kaynak||""}</span>
          ${tarih  ? `<span>📅 ${tarih}</span>` : ""}
          ${domain ? `<a href="${h.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 ${domain}</a>` : ""}
        </div>
      </div>
      <div style="display:flex;align-items:flex-start;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;">
        <span class="badge ${stil.badgeClass}">${stil.label}</span>
        ${enBadge}
        <span class="badge badge-haber">${(h.kategori||h.etiket||"").slice(0,18)}</span>
        ${adminBtnler}
      </div>
    </div>`;
  }).join("");
}

function haberSil(id) {
  _adminMod.sil("haberler", id, sid => {
    tumHaberler = tumHaberler.filter(h => String(h.id) !== sid);
    filtrele();
  });
}

/* ═══════════════════════════════════════════════════════════════
   FİLTRE
═══════════════════════════════════════════════════════════════ */
function filtrele() {
  const q = document.getElementById("searchBox").value.toLowerCase();
  render(tumHaberler.filter(h => {
    // Koleksiyon filtresi
    if (aktifKoleksiyon && h._koleksiyon !== aktifKoleksiyon) return false;
    // İçerik türü filtresi
    if (aktifIcerikTipi && (h.icerik_tipi || "haber") !== aktifIcerikTipi) return false;
    // Kategori filtresi
    if (aktifKategori && !(h.kategori||h.etiket||h.kaynak||"").toLowerCase().includes(aktifKategori.toLowerCase())) return false;
    // Metin arama
    if (q && !(h.baslik+" "+(h.ozet||"")+" "+(h.kaynak||"")).toLowerCase().includes(q)) return false;
    return true;
  }));
}

/* ═══════════════════════════════════════════════════════════════
   DUPLICATE TEMİZLEME
═══════════════════════════════════════════════════════════════ */
function dupTemizle(liste) {
  const gorulen = new Map();
  const temiz = [];
  for (const h of liste) {
    const anahtar = (h.url || h.baslik || "").trim().toLowerCase();
    if (!anahtar || gorulen.has(anahtar)) continue;
    gorulen.set(anahtar, true); temiz.push(h);
  }
  return temiz;
}

function dupTemizleVeKaydet() {
  const onceki = tumHaberler.length;
  tumHaberler = dupTemizle(tumHaberler);
  const silinen = onceki - tumHaberler.length;
  if (typeof SITE !== "undefined") SITE.set("haberler", tumHaberler);
  filtrele();
  gosterBildirim(silinen > 0 ? `✓ ${silinen} duplicate temizlendi.` : "Duplicate bulunamadı.");
}

/* ═══════════════════════════════════════════════════════════════
   JSON/GEOJSON IMPORT
═══════════════════════════════════════════════════════════════ */
function dosyaOku(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const parsed = JSON.parse(e.target.result);
      const log = document.getElementById("importLog");
      importData = null;
      let liste = [];
      if (Array.isArray(parsed)) { liste = parsed; }
      else if (parsed.haberler) { liste = parsed.haberler; }
      else if (parsed.features) { liste = parsed.features.map(f => f.properties || f).filter(Boolean); }
      else if (parsed.ihlaller) { liste = parsed.ihlaller; }
      if (!liste.length) { log.textContent = "⚠ Tanınan kayıt bulunamadı."; return; }
      liste = liste.map((h, i) => ({
        id:       h.id || ("imp_" + Date.now() + "_" + i),
        baslik:   h.baslik || h.name || h.ad || h.title || "",
        kaynak:   h.kaynak || h.source || "",
        kategori: h.kategori || h.etiket || h.tip || "Haber",
        etiket:   h.etiket || h.kategori || h.tip || "Haber",
        tarih:    h.tarih || h.eklenme || new Date().toISOString().slice(0,10),
        url:      h.url || h.kaynak_link || "",
        ozet:     h.ozet || h.aciklama || "",
        icerik_tipi: h.icerik_tipi || "haber",
        dil:         h.dil || "tr",
        _koleksiyon: "haberler",
      })).filter(h => h.baslik);
      importData = liste;
      log.textContent = `✓ ${liste.length} kayıt algılandı.\n\nİlk 3 örnek:\n` +
        liste.slice(0,3).map(h => `• ${h.baslik.slice(0,60)}`).join("\n");
      document.getElementById("importUygula").disabled = false;
    } catch(err) {
      document.getElementById("importLog").textContent = "❌ JSON parse hatası: " + err.message;
    }
  };
  reader.readAsText(file);
}

function importUygula() {
  if (!importData) return;
  const mevcutUrller   = new Set(tumHaberler.map(h => (h.url||"").toLowerCase()));
  const mevcutBasliklar = new Set(tumHaberler.map(h => (h.baslik||"").toLowerCase().slice(0,40)));
  const yeniler = importData.filter(h => {
    const url = (h.url||"").toLowerCase();
    const bas = (h.baslik||"").toLowerCase().slice(0,40);
    return url ? !mevcutUrller.has(url) : !mevcutBasliklar.has(bas);
  });
  tumHaberler = [...yeniler, ...tumHaberler];
  if (typeof SITE !== "undefined") SITE.set("haberler", tumHaberler);
  document.getElementById("importModal").style.display = "none";
  filtrele(); guncelleKolSayac();
  gosterBildirim(`✓ ${yeniler.length} yeni kayıt eklendi (${importData.length - yeniler.length} duplicate atlandı).`);
}

/* ═══════════════════════════════════════════════════════════════
   KOLEKSİYON SAYAÇ GÜNCEL
═══════════════════════════════════════════════════════════════ */
function guncelleKolSayac() {
  const say = { haberler:0, raporlar:0, makaleler:0, uluslararasi:0 };
  tumHaberler.forEach(h => { if (say[h._koleksiyon] !== undefined) say[h._koleksiyon]++; });
  document.getElementById("kSayiHaber").textContent  = say.haberler;
  document.getElementById("kSayiRapor").textContent  = say.raporlar;
  document.getElementById("kSayiMakale").textContent = say.makaleler;
  document.getElementById("kSayiUlus").textContent   = say.uluslararasi;
}

/* ═══════════════════════════════════════════════════════════════
   VERİ YÜKLE — tüm koleksiyonlar
═══════════════════════════════════════════════════════════════ */
function birlestir(data, localHaberler) {
  const silinen = _adminMod.getSilinen("haberler");
  const map = new Map();

  // Tüm koleksiyonları birleştir, _koleksiyon etiketi ekle
  const kollar = [
    { liste: data.haberler     || [], kol: "haberler"     },
    { liste: data.raporlar     || [], kol: "raporlar"     },
    { liste: data.makaleler    || [], kol: "makaleler"    },
    { liste: data.uluslararasi || [], kol: "uluslararasi" },
  ];

  [...kollar.flatMap(k => k.liste.map(h => ({...h, _koleksiyon: k.kol}))),
   ...localHaberler.map(h => ({...h, _koleksiyon: h._koleksiyon || "haberler"}))
  ].forEach(h => {
    if (silinen.has(String(h.id))) return;
    const anahtar = (h.url || h.baslik || String(h.id)).toLowerCase();
    if (!map.has(anahtar)) {
      // icerik_tipi yoksa koleksiyona göre ata
      if (!h.icerik_tipi) {
        h.icerik_tipi = {
          raporlar: "rapor", makaleler: "kose", uluslararasi: "uluslararasi"
        }[h._koleksiyon] || "haber";
      }
      if (!h.kategori && h.etiket) h.kategori = h.etiket;
      map.set(anahtar, h);
    }
  });

  return Array.from(map.values()).sort((a,b) => new Date(b.tarih||0) - new Date(a.tarih||0));
}

function yukle() {
  const localHaberler = typeof SITE !== "undefined" ? SITE.getList("haberler") : [];
  fetch(HABERLER_URL + "?t=" + Date.now())
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(data => {
      tumHaberler = birlestir(data, localHaberler);
      filtrele(); guncelleKolSayac();
      const meta = data.meta?.guncelleme || data._meta?.guncelleme;
      document.getElementById("scanStatus").textContent =
        `${tumHaberler.length} kayıt` + (meta ? " · " + new Date(meta).toLocaleString("tr-TR") : "");
    })
    .catch(() => {
      tumHaberler = birlestir({}, localHaberler);
      filtrele(); guncelleKolSayac();
      document.getElementById("scanStatus").textContent = `${tumHaberler.length} kayıt (yerel)`;
    });
}

/* ═══════════════════════════════════════════════════════════════
   BİLDİRİM
═══════════════════════════════════════════════════════════════ */
function gosterBildirim(mesaj) {
  const b = document.createElement("div");
  b.textContent = mesaj;
  b.style.cssText = "position:fixed;bottom:24px;right:24px;z-index:99999;background:var(--accent);color:var(--dark);font-family:'JetBrains Mono',monospace;font-size:11px;padding:12px 20px;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.4);";
  document.body.appendChild(b);
  setTimeout(() => { b.style.opacity="0"; b.style.transition="opacity .4s"; setTimeout(()=>b.remove(),400); }, 3000);
}

/* ═══════════════════════════════════════════════════════════════
   EVENT LISTENERS
═══════════════════════════════════════════════════════════════ */
// Detay modal
document.getElementById("detailClose").addEventListener("click", () => document.getElementById("detailModal").style.display = "none");
document.getElementById("detailModal").addEventListener("click", function(e) { if (e.target===this) this.style.display="none"; });

// Düzenle modal
document.getElementById("editClose").addEventListener("click",  () => document.getElementById("editModal").style.display = "none");
document.getElementById("editIptal").addEventListener("click",  () => document.getElementById("editModal").style.display = "none");
document.getElementById("editKaydet").addEventListener("click", duzenleKaydet);
document.getElementById("editModal").addEventListener("click",  function(e) { if (e.target===this) this.style.display="none"; });

// Import modal
document.getElementById("importClose").addEventListener("click",  () => document.getElementById("importModal").style.display = "none");
document.getElementById("importIptal").addEventListener("click",  () => document.getElementById("importModal").style.display = "none");
document.getElementById("importUygula").addEventListener("click", importUygula);
document.getElementById("importDrop").addEventListener("click",   () => document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",  e => { if (e.target.files[0]) dosyaOku(e.target.files[0]); });
document.getElementById("importDrop").addEventListener("dragover", e => { e.preventDefault(); e.currentTarget.classList.add("dragover"); });
document.getElementById("importDrop").addEventListener("dragleave",e => { e.currentTarget.classList.remove("dragover"); });
document.getElementById("importDrop").addEventListener("drop",    e => { e.preventDefault(); e.currentTarget.classList.remove("dragover"); if (e.dataTransfer.files[0]) dosyaOku(e.dataTransfer.files[0]); });

// ESC
document.addEventListener("keydown", e => {
  if (e.key === "Escape") ["detailModal","editModal","importModal"].forEach(id => document.getElementById(id).style.display = "none");
});

// Kategori filtreleri
document.querySelectorAll(".filter-btn[data-kat]").forEach(btn => {
  btn.addEventListener("click", () => {
    aktifKategori = btn.dataset.kat;
    document.querySelectorAll(".filter-btn[data-kat]").forEach(b => b.classList.remove("aktif"));
    btn.classList.add("aktif");
    filtrele();
  });
});

// İçerik türü filtreleri
document.querySelectorAll(".filter-btn[data-icerik]").forEach(btn => {
  btn.addEventListener("click", () => {
    if (aktifIcerikTipi === btn.dataset.icerik) {
      // Tekrar tıkla → temizle
      aktifIcerikTipi = "";
      btn.classList.remove("aktif");
    } else {
      aktifIcerikTipi = btn.dataset.icerik;
      document.querySelectorAll(".filter-btn[data-icerik]").forEach(b => b.classList.remove("aktif"));
      btn.classList.add("aktif");
    }
    filtrele();
  });
});

// Koleksiyon çipler
document.querySelectorAll(".kol-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    aktifKoleksiyon = chip.dataset.kol;
    document.querySelectorAll(".kol-chip").forEach(c => c.classList.remove("aktif-kol"));
    chip.classList.add("aktif-kol");
    // İçerik türü butonunu da eşitle
    aktifIcerikTipi = "";
    document.querySelectorAll(".filter-btn[data-icerik]").forEach(b => b.classList.remove("aktif"));
    if (aktifKoleksiyon === "raporlar") {
      aktifIcerikTipi = "rapor";
      document.querySelector('.filter-btn[data-icerik="rapor"]')?.classList.add("aktif");
    } else if (aktifKoleksiyon === "makaleler") {
      aktifIcerikTipi = "kose";
      document.querySelector('.filter-btn[data-icerik="kose"]')?.classList.add("aktif");
    } else if (aktifKoleksiyon === "uluslararasi") {
      aktifIcerikTipi = "uluslararasi";
      document.querySelector('.filter-btn[data-icerik="uluslararasi"]')?.classList.add("aktif");
    }
    filtrele();
  });
});

// Admin araçları
if (typeof SITE !== "undefined" && SITE.isAdmin()) {
  const alan = document.getElementById("adminAlan");

  const btnYenile = document.createElement("button");
  btnYenile.className = "btn-tara"; btnYenile.innerHTML = "↻ Yenile";
  btnYenile.onclick = () => { btnYenile.disabled=true; btnYenile.innerHTML="↻ Yükleniyor…"; yukle(); setTimeout(()=>{btnYenile.disabled=false;btnYenile.innerHTML="↻ Yenile";},2000); };
  alan.appendChild(btnYenile);

  const btnDup = document.createElement("button");
  btnDup.className = "btn-dup"; btnDup.innerHTML = "⊗ Duplicate Temizle";
  btnDup.onclick = dupTemizleVeKaydet;
  alan.appendChild(btnDup);

  const btnImport = document.createElement("button");
  btnImport.className = "btn-import"; btnImport.innerHTML = "⬆ JSON / GeoJSON İçe Aktar";
  btnImport.onclick = () => {
    importData = null;
    document.getElementById("importLog").textContent = "Dosya bekleniyor…";
    document.getElementById("importUygula").disabled = true;
    document.getElementById("importModal").style.display = "flex";
  };
  alan.appendChild(btnImport);
}

yukle();
</script>
