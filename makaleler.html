<style>

.kat-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:3px;cursor:pointer;transition:all .2s;border:1px solid transparent;margin-bottom:2px;}

.kat-tumu{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:3px;cursor:pointer;transition:all .2s;border:1px solid rgba(45,158,107,.15);background:rgba(45,158,107,.05);margin-bottom:10px;}
.kat-tumu:hover{background:rgba(45,158,107,.12);}

.kat-separator{font-family:"JetBrains Mono",monospace;font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.45;padding:10px 12px 5px;margin-top:4px;}

/* Sidebar ek bloklar */

.sidebar-block h4{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}

.badge-hukuk   {background:rgba(240,165,0,.1);color:#f0a500;border:1px solid rgba(240,165,0,.25);}

/* Modal */

.modal-close:hover{color:var(--cream);}
.btn-modal{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;background:var(--accent);color:var(--dark);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-radius:3px;border:none;cursor:pointer;transition:all .2s;}

}

<script>
const SABIT_MAKALELER = [
  {id:"sm0",baslik:"Madenciliğin Gölgesinde: Türkiye'de Altın Arama Lisanslarının Ekosistem Maliyeti",kategori:"analiz",kategoriLabel:"Analiz",yazar:"Dr. Ayşe Konak",tarih:"2025-03-10",okumaSuresi:"18 dk",ozet:"2010–2024 yılları arasında verilen 4.200'den fazla maden arama ruhsatının coğrafi ve ekolojik çakışma analizi.",icerik:`<p>Türkiye, 2010 yılından bu yana maden ruhsatı dağıtımında en hızlı büyüyen ülkeler arasındadır. MAPEG verilerine göre 2024 itibarıyla aktif 4.287 arama ruhsatı ülke topraklarının yaklaşık yüzde 28'ini kapsamaktadır.</p><h3>Orman Alanlarıyla Çakışma</h3><p>Bu ruhsatların yüzde 41'i "koruma öncelikli" alanlarda yoğunlaşmaktadır. Karadeniz ve Ege kıyı kuşaklarında bu oran yüzde 60'ı aşmaktadır.</p><blockquote>"Bir ruhsatın verilmesi, bölgedeki tüm arazi kullanım haklarını askıya almaktadır."</blockquote><h3>Su Havzası Riski</h3><p>Ruhsatların yüzde 23'ü birinci derece su koruma havzaları içinde kalmaktadır. Asit maden drenajı (AMD) riski bu alanlarda kritik tehdit oluşturmaktadır.</p>`,etiketler:["maden","MAPEG","orman","su havzası","ruhsat"],url:"https://bianet.org/bianet/ekoloji/303012-madencilik-ekosistem"},
  {id:"sm1",baslik:"HES'lerin Sessiz Katliamı: Dere Ekosistemlerinde Biyolojik Çeşitlilik Kaybı",kategori:"saha",kategoriLabel:"Saha Raporu",yazar:"Emre Türkmen, Biyolog",tarih:"2025-02-18",okumaSuresi:"12 dk",ozet:"Karadeniz havzasındaki 14 HES üzerinde yürütülen saha çalışmasının bulguları.",icerik:`<p>2022–2024 yılları arasında Karadeniz havzasında 14 HES'e ait akarsu kesimlerinde yürütülen biyolojik envanter, akuatik biyoçeşitlilik üzerindeki yıkıcı etkileri belgelemektedir.</p><h3>Balık Türü Kaybı</h3><p>HES öncesi döneme kıyasla ortalama tür zenginliği yüzde 67 gerilemiştir. Endemik alabalık türlerinde bu oran bazı istasyonlarda yüzde 90'a ulaşmaktadır.</p><blockquote>"Çevresel akış değerleri kağıt üzerinde belirlenmiş; ancak fiili denetim yokluğunda sadece birer rakamdan ibaret kalmaktadır."</blockquote>`,etiketler:["HES","balık türü","Karadeniz","biyoçeşitlilik"],url:"https://yesilgazete.org/hes-biyoceşitlilik"},
  {id:"sm2",baslik:"ÇED Mevzuatının Delinmesi: 'Alt Eşik' Stratejisi ve Hukuki Boşluklar",kategori:"hukuk",kategoriLabel:"Hukuki İnceleme",yazar:"Av. Selin Çelik",tarih:"2025-01-30",okumaSuresi:"15 dk",ozet:"Projelerin ÇED eşiğinin altında kalacak biçimde yapay olarak bölünmesi uygulamasının hukuki analizi.",icerik:`<p>ÇED yönetmeliği kapsamındaki eşik değerlerin altında kalmak amacıyla projelerin kasıtlı biçimde parçalandığı "alt eşik stratejisi" Türkiye'de giderek yaygınlaşmaktadır.</p><h3>Örüntü Analizi</h3><p>2018–2024 yıllarında incelenen 340 proje dosyasında, aynı yatırımcıya ait projelerin her birinin ÇED eşiğinin hemen altında kaldığı görülmektedir.</p><blockquote>"Kümülatif etki değerlendirmesinin yasal zorunluluk olmaktan çıkarılması bu stratejiyi hukuken savunulabilir kılmaktadır."</blockquote>`,etiketler:["ÇED","hukuk","Danıştay","kümülatif etki"],url:"https://barobirlik.org.tr/Haberler/ced-mevzuat"},
  {id:"sm3",baslik:"Türkiye'de Orman Yangınları 2019–2024: Uydu Verileriyle Sistematik Analiz",kategori:"veri",kategoriLabel:"Veri / İstatistik",yazar:"Zeynep Arslan, CBS Uzmanı",tarih:"2024-12-05",okumaSuresi:"10 dk",ozet:"NASA FIRMS ve Sentinel-2 uydu görüntülerinden derlenen 6 yıllık yangın verilerinin mekansal analizi.",icerik:`<p>NASA FIRMS ve Sentinel-2 uydu görüntüleri kullanılarak derlenen bu veri seti, 2019–2024 dönemindeki orman yangınlarının mekansal ve zamansal dağılımını ortaya koymaktadır.</p><h3>Temel Bulgular</h3><p>6 yıllık dönemde toplam 847.000 hektar orman ve makilik alan yangından etkilenmiştir. Yıllık ortalama yanan alan 2022–2024 döneminde yüzde 340 artış göstermiştir.</p><blockquote>"İklim değişikliğine bağlı kuraklık, yangın ekolojisini köklü biçimde dönüştürmektedir."</blockquote>`,etiketler:["yangın","NASA FIRMS","uydu","Muğla","iklim"],url:"https://firms.modaps.eosdis.nasa.gov"},
  {id:"sm4",baslik:"Kentsel Dönüşüm ve Kentsel Yeşil Alan Kaybı: İstanbul Örneği",kategori:"politika",kategoriLabel:"Politika",yazar:"Prof. Dr. Murat Gül",tarih:"2024-11-20",okumaSuresi:"14 dk",ozet:"2012–2024 yılları arasında İstanbul'da kentsel yeşil alan kaybının belgelenmesi ve politika önerileri.",icerik:`<p>İstanbul, 2012'de yürürlüğe giren kentsel dönüşüm mevzuatının ardından hız kazanan yapılaşma süreciyle birlikte kritik yeşil alan kayıpları yaşamaktadır.</p><h3>Yeşil Alan Kaybı</h3><p>2012–2024 döneminde park, orman ve koruluk alanların toplam yüzölçümü 14.700 hektar azalmıştır.</p><h3>Sağlık Boyutu</h3><p>Yeşil alan kayıplarının yoğunlaştığı ilçelerde kentsel ısı adası etkisi belirgin biçimde artmış, ortalama yaz sıcaklıkları 3–5 derece yükselmiştir.</p>`,etiketler:["İstanbul","kentsel dönüşüm","yeşil alan","ısı adası"],url:"https://ekolojipolitik.com/kentsel-donusum-yesil-alan"},
  {id:"sm5",baslik:"Tarım Arazisi Dönüşümü: Antalya Ovası'nda Sera Yapılaşması",kategori:"saha",kategoriLabel:"Saha Raporu",yazar:"Neslihan Öztürk",tarih:"2024-10-08",okumaSuresi:"9 dk",ozet:"Antalya'nın verimli tarım ovalarında plastik sera örtüsünün toprak ve su kaynaklarına etkileri.",icerik:`<p>Türkiye'nin örtü altı tarım üretiminin yüzde 45'ini karşılayan Antalya ovası, hızla genişleyen plastik sera alanlarının ekolojik yüküyle boğuşmaktadır.</p><h3>Toprak Tuzlanması</h3><p>Yoğun sulama ve kimyasal girdi kullanımının yaygınlaştığı alanlarda toprak elektriksel iletkenlik değerleri doğal eşiğin 4–8 katına ulaşmaktadır.</p><h3>Plastik Atık</h3><p>Her yıl değiştirilen örtü malzemesinden kaynaklanan plastik atık 120.000 tona ulaşmaktadır.</p>`,etiketler:["Antalya","sera","toprak","plastik atık","tarım"],url:"https://ekolojipolitik.com/antalya-sera-tarim"},
];

const KAT_BADGEMAP = {analiz:"badge-analiz",hukuk:"badge-hukuk",saha:"badge-saha",veri:"badge-veri",politika:"badge-politika"};
const KAT_LABELMAP = {analiz:"Analiz",hukuk:"Hukuki İnceleme",saha:"Saha Raporu",veri:"Veri / İstatistik",politika:"Politika"};

let aktifKat = "hepsi";
let goruntulenecek = 10;
let tumListe = [];
let filtreliListe = [];

function _esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function tumMakaleler(){
  const siteListe = (typeof SITE!=="undefined"?SITE.getList("makaleler"):[]) || [];
  const sabitIds  = new Set(SABIT_MAKALELER.map(m=>String(m.id)));
  const ekler     = siteListe.filter(m=>!sabitIds.has(String(m.id)));
  return [...ekler,...SABIT_MAKALELER].sort((a,b)=>{
    const ta=a.tarih?new Date(a.tarih):new Date(0);
    const tb=b.tarih?new Date(b.tarih):new Date(0);
    return tb-ta;
  });
}

function badgeCls(kat){return KAT_BADGEMAP[kat]||"badge-diger";}
function badgeLabel(m){return m.kategoriLabel||KAT_LABELMAP[m.kategori]||m.kategori||m.tur||"Makale";}

function renderGrid(){
  const q = (document.getElementById("searchBox")||{value:""}).value.toLowerCase();
  filtreliListe = tumListe.filter(m=>{
    if(aktifKat!=="hepsi"&&aktifKat!=="diger"){
      if((m.kategori||"")!==aktifKat) return false;
    } else if(aktifKat==="diger"){
      if(KAT_BADGEMAP[m.kategori]) return false;
    }
    if(q&&!((m.baslik||"")+" "+(m.ozet||"")+" "+(m.yazar||"")).toLowerCase().includes(q)) return false;
    return true;
  });

  const grid = document.getElementById("makalelerGrid");
  const liste = filtreliListe.slice(0, goruntulenecek);
  if(!liste.length){grid.innerHTML='<div class="empty">Bu kategoride makale bulunamadı.</div>';document.getElementById("dahaFazlaBtn").style.display="none";return;}

  grid.innerHTML = liste.map((m,i)=>{
    const tarih = m.tarih?new Date(m.tarih).toLocaleDateString("tr-TR",{day:"numeric",month:"short",year:"numeric"}):"";
    const domain = (m.url||m.kaynak_url)?(()=>{try{return new URL(m.url||m.kaynak_url).hostname.replace("www.","");}catch(e){return "";}})():"";
    const bl = badgeLabel(m);
    const bc = badgeCls(m.kategori);
    return `<div class="haber-kart" onclick="makaleAc('${_esc(String(m.id))}')">
      <div>
        <h3>${_esc(m.baslik)}</h3>
        ${m.ozet?`<p class="haber-kart-ozet">${_esc(m.ozet)}</p>`:""}
        <div class="haber-kart-meta">
          ${m.yazar?`<span>✍ ${_esc(m.yazar)}</span>`:""}
          ${tarih?`<span>📅 ${_esc(tarih)}</span>`:""}
          ${m.okumaSuresi?`<span>⏱ ${_esc(m.okumaSuresi)}</span>`:""}
          ${domain?`<a href="${_esc(m.url||m.kaynak_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 ${_esc(domain)}</a>`:""}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;">
        <span class="badge ${bc}">${_esc(bl)}</span>
      </div>
    </div>`;
  }).join("");

  document.getElementById("dahaFazlaBtn").style.display = goruntulenecek>=filtreliListe.length?"none":"inline-flex";
  guncelleStatus();
  guncelleSidebar();
}

function dahaFazlaYukle(){goruntulenecek+=10;renderGrid();}

function setKat(el,fromSidebar){
  aktifKat = el.dataset.kat||"hepsi";
  goruntulenecek = 10;
  // Filter bar
  document.querySelectorAll(".filter-chip").forEach(c=>c.classList.toggle("aktif",(c.dataset.kat||"")===(aktifKat==="diger"?"diger":aktifKat)));
  // Sidebar
  document.querySelectorAll(".kat-item,.kat-tumu").forEach(c=>c.classList.toggle("aktif-kat",(c.dataset.kat||""===aktifKat||(c.dataset.kat||"")==="hepsi"&&aktifKat==="hepsi")));
  document.querySelectorAll(".kat-item,.kat-tumu").forEach(c=>c.classList.toggle("aktif-kat",(c.dataset.kat||"")===(aktifKat)));
  renderGrid();
}

function guncelleStatus(){
  const el = document.getElementById("scanStatus");
  if(el) el.textContent = filtreliListe.length+" makale";
}

function guncelleSidebar(){
  const say={analiz:0,hukuk:0,saha:0,veri:0,politika:0,diger:0};
  tumListe.forEach(m=>{
    const k=m.kategori||"";
    if(say[k]!==undefined) say[k]++;
    else say.diger++;
  });
  document.getElementById("ks_toplam").textContent = tumListe.length;
  ["analiz","hukuk","saha","veri","politika","diger"].forEach(k=>{
    const el=document.getElementById("ks_"+k);
    if(el) el.textContent=say[k]||"0";
  });

  // Son makaleler sidebar
  const son = tumListe.slice(0,5);
  document.getElementById("sonMakaleler").innerHTML = son.map((m,i)=>`
    <div class="sidebar-link" onclick="makaleAc('${_esc(String(m.id))}')">
      <span class="sl-num">0${i+1}</span>
      <span class="sl-title">${_esc(m.baslik)}</span>
    </div>`).join("");

  // Etiketler
  const tumEt=[...new Set(tumListe.flatMap(m=>Array.isArray(m.etiketler)?m.etiketler:[]))].slice(0,20);
  document.getElementById("etiketler").innerHTML = tumEt.map(t=>`<span class="tag" onclick="document.getElementById('searchBox').value='${_esc(t)}';renderGrid();">${_esc(t)}</span>`).join("");
}

function makaleAc(id){
  const sid=String(id);
  const m=tumListe.find(x=>String(x.id)===sid);
  if(!m)return;
  const tarih=m.tarih?new Date(m.tarih).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}):"";
  const domain=(m.url||m.kaynak_url)?(()=>{try{return new URL(m.url||m.kaynak_url).hostname.replace("www.","");}catch(e){return "";}})():"";
  document.getElementById("mcat").textContent = badgeLabel(m);
  document.getElementById("mtitle").textContent = m.baslik;
  const fotoEl=document.getElementById("mfoto");
  if(m.foto_url){fotoEl.src=m.foto_url;fotoEl.style.display="block";fotoEl.onerror=()=>fotoEl.style.display="none";}
  else fotoEl.style.display="none";
  document.getElementById("mmeta").innerHTML=
    (m.yazar?`<span>✍ ${_esc(m.yazar)}</span>`:"")+
    (tarih?`<span>📅 ${_esc(tarih)}</span>`:"")+
    (m.okumaSuresi?`<span>⏱ ${_esc(m.okumaSuresi)}</span>`:"")+
    (domain?`<span>🔗 ${_esc(domain)}</span>`:"");
  const et=Array.isArray(m.etiketler)?m.etiketler:[];
  const etEl=document.getElementById("metiketler");
  if(et.length){etEl.style.display="flex";etEl.innerHTML=et.map(e=>`<span style="font-family:'JetBrains Mono',monospace;font-size:8px;padding:2px 8px;border-radius:2px;background:rgba(45,158,107,.1);border:1px solid rgba(45,158,107,.2);color:#4db888;">${_esc(e)}</span>`).join("");}
  else{etEl.style.display="none";}
  document.getElementById("mcontent").innerHTML=m.icerik||(m.ozet?`<p>${_esc(m.ozet)}</p>`:'<p style="opacity:.5">İçerik mevcut değil.</p>');
  const mpdf=document.getElementById("mpdf");
  const murl=document.getElementById("murl");
  const isPdf=u=>u&&/\.pdf(\?|$)/i.test(u);
  const isDoc=u=>u&&/\.(doc|docx)(\?|$)/i.test(u);
  const dosyaUrl=m.pdf_url||m.dosya||"";
  const kaynakUrl=m.url||m.kaynak_url||"";
  if(dosyaUrl){mpdf.href=dosyaUrl;mpdf.textContent=isPdf(dosyaUrl)?"📥 PDF İndir":isDoc(dosyaUrl)?"📝 DOC İndir":"📎 Dosyayı Aç";mpdf.style.display="inline-flex";}
  else mpdf.style.display="none";
  if(kaynakUrl){murl.href=kaynakUrl;if(isPdf(kaynakUrl)){murl.textContent="📥 PDF İndir";murl.setAttribute("download","");}else if(isDoc(kaynakUrl)){murl.textContent="📝 DOC İndir";murl.setAttribute("download","");}else{murl.textContent=`Makaleye Git — ${domain||kaynakUrl}`;murl.removeAttribute("download");}murl.style.display="inline-flex";}
  else murl.style.display="none";
  document.getElementById("makaleModal").style.display="flex";
  document.body.style.overflow="hidden";
}

function makaleKapat(){
  document.getElementById("makaleModal").style.display="none";
  document.body.style.overflow="";
}
document.getElementById("makaleModal").addEventListener("click",function(e){if(e.target===this)makaleKapat();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")makaleKapat();});

/* İlk render - makaleler.json'dan yükle, sonra render et */
fetch('./makaleler.json?v='+Date.now())
  .then(r=>r.json())
  .then(d=>{ if(typeof SITE!=='undefined'&&d.makaleler) SITE.bulkImport('makaleler',d.makaleler); })
  .catch(()=>{})
  .finally(()=>{
    tumListe = tumMakaleler();
    document.getElementById("ks_toplam").textContent = tumListe.length;
    document.getElementById("scanStatus").textContent = tumListe.length+" makale";
    renderGrid();
  });
</script>
</body>
</html>
