<style>

.filter-bar{background:var(--dark);padding:10px 80px;border-bottom:1px solid rgba(45,158,107,.07);display:flex;gap:6px;flex-wrap:wrap;}
.filter-chip{font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--muted);letter-spacing:.06em;cursor:pointer;padding:5px 12px;border-radius:2px;border:1px solid transparent;transition:all .2s;text-transform:uppercase;}
.filter-chip:hover{border-color:rgba(45,158,107,.2);color:var(--cream);}

.scan-bar{background:var(--dark);padding:14px 80px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(45,158,107,.1);}
.scan-status{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--muted);flex:1;}

.content{background:var(--dark);padding:40px 80px 60px;min-height:60vh;}
.content-layout{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start;}

.kat-sidebar{position:sticky;top:80px;}
.kat-sidebar-title{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 0 10px;border-bottom:1px solid rgba(45,158,107,.1);margin-bottom:8px;}
.kat-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:3px;cursor:pointer;transition:all .2s;border:1px solid transparent;margin-bottom:2px;}
.kat-item:hover{background:rgba(45,158,107,.07);border-color:rgba(45,158,107,.12);}
.kat-item.aktif-kat{background:rgba(45,158,107,.1);border-color:rgba(45,158,107,.25);}

/* Modal */

.btn-modal:hover{background:var(--bright);}

  .kat-item{padding:6px 10px;}
  .kat-sayi{display:none;}
}
</style>

<script>
const SABIT_MAKALELER = [];

const KAT_BADGEMAP = {analiz:"badge-analiz",hukuk:"badge-hukuk",saha:"badge-saha",veri:"badge-veri",politika:"badge-politika"};
const KAT_LABELMAP = {analiz:"Analiz",hukuk:"Hukuki İnceleme",saha:"Saha Raporu",veri:"Veri / İstatistik",politika:"Politika"};

// Tarayıcının (kategori alanı) ve admin panelinin (tur alanı) ürettiği ham
// değerler, sidebar/filtre çubuğundaki 5 gruptan (analiz/hukuk/saha/veri/politika)
// FARKLI metinler. Bu eşleştirme olmadan filtreler hep boş dönüyordu.
// NOT: şu an "veri" (Veri / İstatistik) grubuna denk gelen bir kaynak yok;
// bu grup canlıda boş görünebilir, yeni bir veri/istatistik kaynağı eklenene kadar normaldir.
const KATEGORI_ESLESTIRME = {
  // — tarayici.py kaynak kategorileri —
  "Köşe / Yorum":        "politika",
  "Köşe / Görüş":        "politika",
  "Görüş / Yorum":       "politika",
  "Analiz / Yorum":      "analiz",
  "Yorum / Değerlendirme":"analiz",
  "Hukuki Yorum":        "hukuk",
  "Mühendislik / Analiz":"analiz",
  // — admin.html "tur" alanı değerleri —
  "Resmi Açıklama":      "politika",
  "Basın Bülteni":       "politika",
  "Kurum Bildirisi":     "politika",
  "Köşe Yazısı":         "politika",
  "Açık Mektup":         "politika",
  "Analiz":              "analiz",
  "Araştırma":           "analiz",
  "Akademik Makale":     "analiz",
  "Vaka Çalışması":      "saha",
  "Politika Belgesi":    "politika",
  "Röportaj":            "diger",
  "Çeviri / Derleme":    "diger",
  "Bireysel Yazı":       "diger",
  "Diğer":               "diger"
};
// Bir makale kaydının filtre grubunu döndürür (analiz/hukuk/saha/veri/politika/diger).
// Önce ham "kategori" (tarayıcı), sonra "tur" (admin panel) alanına bakar.
function katGrup(m){
  if(!m) return "diger";
  const ham = m.kategori || m.tur || "";
  return KATEGORI_ESLESTIRME[ham] || "diger";
}

let aktifKat = "hepsi";
let goruntulenecek = 10;
let tumListe = [];
let filtreliListe = [];

function _esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// NOT: Sayfa "o ayın verisi"ni gösterir — ay, gerçek yayın tarihine (tarih) göre
// belirlenir (yoksa keşif tarihi "tarama_tarihi"ne düşülür). Yayın tarihi eski
// olan bir makale, o gün ilk kez keşfedilmiş olsa bile burada elenir (arşive gider).
// (Sunucu tarafında zaten budanıyor; bu, localStorage/eski önbellek kaynaklı
// kayıtlara karşı ikinci bir savunma katmanıdır — bkz. raporlar.html.)
const _buAyMakD = new Date();
const _buAyMak = `${_buAyMakD.getFullYear()}-${String(_buAyMakD.getMonth()+1).padStart(2,"0")}`;
const _guncelAydaMak = m => { const ay = (m && (m.tarih || m.tarama_tarihi) ? String(m.tarih || m.tarama_tarihi) : "").slice(0,7); return ay.length !== 7 || ay >= _buAyMak; };

function tumMakaleler(){
  const siteListe = (typeof SITE!=="undefined"?SITE.getList("makaleler"):[]) || [];
  const sabitIds  = new Set(SABIT_MAKALELER.map(m=>String(m.id)));
  const ekler     = siteListe.filter(m=>!sabitIds.has(String(m.id)));
  // Sıralama önce gerçek yayın tarihine (tarih) bakar; yoksa keşif tarihine
  // (tarama_tarihi) düşer.
  return [...ekler,...SABIT_MAKALELER].filter(_guncelAydaMak).sort((a,b)=>{
    const ta=a.tarih?new Date(a.tarih):(a.tarama_tarihi?new Date(a.tarama_tarihi):new Date(0));
    const tb=b.tarih?new Date(b.tarih):(b.tarama_tarihi?new Date(b.tarama_tarihi):new Date(0));
    return tb-ta;
  });
}

function badgeCls(kat){return KAT_BADGEMAP[kat]||"badge-diger";}
function badgeLabel(m){return m.kategoriLabel||KAT_LABELMAP[katGrup(m)]||m.kategori||m.tur||"Makale";}

function renderGrid(){
  const q = (document.getElementById("searchBox")||{value:""}).value.toLowerCase();
  filtreliListe = tumListe.filter(m=>{
    if(aktifKat!=="hepsi"){
      if(katGrup(m)!==aktifKat) return false;
    }
    if(q&&!((m.baslik||"")+" "+(m.ozet||"")+" "+(m.yazar||"")).toLowerCase().includes(q)) return false;
    return true;
  });

  const grid = document.getElementById("makalelerGrid");
  const liste = filtreliListe.slice(0, goruntulenecek);
  if(!liste.length){grid.innerHTML='<div class="empty">Bu kategoride makale bulunamadı.</div>';document.getElementById("dahaFazlaBtn").style.display="none";return;}

  grid.innerHTML = liste.map((m,i)=>{
    const tarih = m.tarih?new Date(m.tarih).toLocaleDateString("tr-TR",{day:"numeric",month:"short",year:"numeric"}):"";
    const domain = (m.url||m.kaynak_url)?(()=>{try{return new URL(m.url||m.kaynak_url).hostname.replace("www.","");}catch(e){return "";}})():"";
    const bl = badgeLabel(m);
    const bc = badgeCls(katGrup(m));
    return `<div class="haber-kart" onclick="makaleAc('${_esc(String(m.id))}')">
      <div>
        <h3>${_esc(m.baslik)}</h3>
        ${m.ozet?`<p class="haber-kart-ozet">${_esc(m.ozet)}</p>`:""}
        <div class="haber-kart-meta">
          ${m.yazar?`<span>✍ ${_esc(m.yazar)}</span>`:""}
          ${tarih?`<span>📅 ${_esc(tarih)}</span>`:""}
          ${m.okumaSuresi?`<span>⏱ ${_esc(m.okumaSuresi)}</span>`:""}
          ${domain?`<a href="${_esc(m.url||m.kaynak_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🔗 ${_esc(domain)}</a>`:""}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;">
        <span class="badge ${bc}">${_esc(bl)}</span>
      </div>
    </div>`;
  }).join("");

  document.getElementById("dahaFazlaBtn").style.display = goruntulenecek>=filtreliListe.length?"none":"inline-flex";
  guncelleStatus();
  guncelleSidebar();
}

function dahaFazlaYukle(){goruntulenecek+=10;renderGrid();}

function setKat(el,fromSidebar){
  aktifKat = el.dataset.kat||"hepsi";
  goruntulenecek = 10;
  // Filter bar
  document.querySelectorAll(".filter-chip").forEach(c=>c.classList.toggle("aktif",(c.dataset.kat||"")===(aktifKat==="diger"?"diger":aktifKat)));
  // Sidebar
  document.querySelectorAll(".kat-item,.kat-tumu").forEach(c=>c.classList.toggle("aktif-kat",(c.dataset.kat||""===aktifKat||(c.dataset.kat||"")==="hepsi"&&aktifKat==="hepsi")));
  document.querySelectorAll(".kat-item,.kat-tumu").forEach(c=>c.classList.toggle("aktif-kat",(c.dataset.kat||"")===(aktifKat)));
  renderGrid();
}

function guncelleStatus(){
  const el = document.getElementById("scanStatus");
  if(el) el.textContent = filtreliListe.length+" makale";
}

function guncelleSidebar(){
  const say={analiz:0,hukuk:0,saha:0,veri:0,politika:0,diger:0};
  tumListe.forEach(m=>{
    say[katGrup(m)]++;
  });
  document.getElementById("ks_toplam").textContent = tumListe.length;
  ["analiz","hukuk","saha","veri","politika","diger"].forEach(k=>{
    const el=document.getElementById("ks_"+k);
    if(el) el.textContent=say[k]||"0";
  });

  // Son makaleler sidebar
  const son = tumListe.slice(0,5);
  document.getElementById("sonMakaleler").innerHTML = son.map((m,i)=>`
    <div class="sidebar-link" onclick="makaleAc('${_esc(String(m.id))}')">
      <span class="sl-num">0${i+1}</span>
      <span class="sl-title">${_esc(m.baslik)}</span>
    </div>`).join("");

  // Etiketler
  const tumEt=[...new Set(tumListe.flatMap(m=>Array.isArray(m.etiketler)?m.etiketler:[]))].slice(0,20);
  document.getElementById("etiketler").innerHTML = tumEt.map(t=>`<span class="tag" onclick="document.getElementById('searchBox').value='${_esc(t)}';renderGrid();">${_esc(t)}</span>`).join("");
}

function makaleAc(id){
  const sid=String(id);
  const m=tumListe.find(x=>String(x.id)===sid);
  if(!m)return;
  const tarih=m.tarih?new Date(m.tarih).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}):"";
  const domain=(m.url||m.kaynak_url)?(()=>{try{return new URL(m.url||m.kaynak_url).hostname.replace("www.","");}catch(e){return "";}})():"";
  document.getElementById("mcat").textContent = badgeLabel(m);
  document.getElementById("mtitle").textContent = m.baslik;
  const fotoEl=document.getElementById("mfoto");
  if(m.foto_url){fotoEl.src=m.foto_url;fotoEl.style.display="block";fotoEl.onerror=()=>fotoEl.style.display="none";}
  else fotoEl.style.display="none";
  document.getElementById("mmeta").innerHTML=
    (m.yazar?`<span>✍ ${_esc(m.yazar)}</span>`:"")+
    (tarih?`<span>📅 ${_esc(tarih)}</span>`:"")+
    (m.okumaSuresi?`<span>⏱ ${_esc(m.okumaSuresi)}</span>`:"")+
    (domain?`<span>🔗 ${_esc(domain)}</span>`:"");
  const et=Array.isArray(m.etiketler)?m.etiketler:[];
  const etEl=document.getElementById("metiketler");
  if(et.length){etEl.style.display="flex";etEl.innerHTML=et.map(e=>`<span style="font-family:'JetBrains Mono',monospace;font-size:8px;padding:2px 8px;border-radius:2px;background:rgba(45,158,107,.1);border:1px solid rgba(45,158,107,.2);color:#4db888;">${_esc(e)}</span>`).join("");}
  else{etEl.style.display="none";}
  document.getElementById("mcontent").innerHTML=m.icerik||(m.ozet?`<p>${_esc(m.ozet)}</p>`:'<p style="opacity:.5">İçerik mevcut değil.</p>');
  const mpdf=document.getElementById("mpdf");
  const murl=document.getElementById("murl");
  const isPdf=u=>u&&/\.pdf(\?|$)/i.test(u);
  const isDoc=u=>u&&/\.(doc|docx)(\?|$)/i.test(u);
  const dosyaUrl=m.pdf_url||m.dosya||"";
  const kaynakUrl=m.url||m.kaynak_url||"";
  if(dosyaUrl){mpdf.href=dosyaUrl;mpdf.textContent=isPdf(dosyaUrl)?"📥 PDF İndir":isDoc(dosyaUrl)?"📝 DOC İndir":"📎 Dosyayı Aç";mpdf.style.display="inline-flex";}
  else mpdf.style.display="none";
  if(kaynakUrl){murl.href=kaynakUrl;if(isPdf(kaynakUrl)){murl.textContent="📥 PDF İndir";murl.setAttribute("download","");}else if(isDoc(kaynakUrl)){murl.textContent="📝 DOC İndir";murl.setAttribute("download","");}else{murl.textContent=`Makaleye Git — ${domain||kaynakUrl}`;murl.removeAttribute("download");}murl.style.display="inline-flex";}
  else murl.style.display="none";
  document.getElementById("makaleModal").style.display="flex";
  document.body.style.overflow="hidden";
}

function makaleKapat(){
  document.getElementById("makaleModal").style.display="none";
  document.body.style.overflow="";
}
document.getElementById("makaleModal").addEventListener("click",function(e){if(e.target===this)makaleKapat();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")makaleKapat();});

/* İlk render - makaleler.json'dan yükle, sonra render et */
fetch('./makaleler.json?v='+Date.now())
  .then(r=>r.json())
  .then(d=>{ if(typeof SITE!=='undefined') SITE.set('makaleler', Array.isArray(d.makaleler)?d.makaleler:[]); })
  .catch(()=>{})
  .finally(()=>{
    tumListe = tumMakaleler();
    document.getElementById("ks_toplam").textContent = tumListe.length;
    document.getElementById("scanStatus").textContent = tumListe.length+" makale";
    renderGrid();
  });
</script>
</body>
