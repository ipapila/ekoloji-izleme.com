<!DOCTYPE html>
<html lang="tr">
<head>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LTTD3L198S"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-LTTD3L198S");
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekoloji Haritası — ekoloji-izleme.com</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /*
   * ✅ DÜZELTİLDİ: Tam ekran + overflow:hidden → Normal sayfa yapısı
   * Nav üstte sabit, harita içeriği gövde bölümünde render edilir.
   * Ticker harita sayfasında gösterilmez (topbar zaten istatistik gösteriyor).
   */

  body {
    margin: 0;
    padding-top: 64px; /* sabit nav yüksekliği */
    background: var(--dark);
    /* overflow:hidden kaldırıldı — sayfa normal akışta */
  }

  /* Harita sarmalayıcı — normal blok eleman, flex ile iframe'i doldurur */
  .harita-wrap {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 64px); /* viewport - nav */
    min-height: 500px;
  }

  /* Üst şerit — başlık + bilgi + butonlar */
  .harita-topbar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 10px 28px;
    background: rgba(8,21,14,.95);
    border-bottom: 1px solid rgba(45,158,107,.2);
    backdrop-filter: blur(8px);
    flex-shrink: 0;
    z-index: 10;
  }

  .harita-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--white);
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .harita-title span { color: var(--bright); }

  .harita-live {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--bright);
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--bright);
    animation: blink 2s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.2;} }

  .harita-stats {
    display: flex;
    gap: 24px;
    margin-left: auto;
    flex-shrink: 0;
  }
  .hstat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .hstat b {
    font-size: 14px;
    color: var(--bright);
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: .03em;
  }

  .btn-geri {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    background: transparent;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid rgba(45,158,107,.2);
    border-radius: 3px;
    transition: all .2s;
    flex-shrink: 0;
  }
  .btn-geri:hover {
    color: var(--bright);
    border-color: rgba(45,158,107,.5);
    background: rgba(45,158,107,.08);
  }

  .btn-tam {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 14px;
    background: rgba(45,158,107,.15);
    color: var(--bright);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1px solid rgba(45,158,107,.35);
    border-radius: 3px;
    transition: all .2s;
    flex-shrink: 0;
  }
  .btn-tam:hover {
    background: rgba(45,158,107,.28);
    border-color: var(--bright);
  }

  /* Harita iframe — kalan tüm alanı doldur */
  #haritaFrame {
    flex: 1;
    width: 100%;
    border: none;
    display: block;
    background: var(--forest);
    min-height: 0; /* flex shrink için gerekli */
  }

  @media (max-width: 700px) {
    .harita-stats { display: none; }
    .harita-topbar { padding: 8px 14px; gap: 10px; }
    .harita-title { font-size: 18px; }
  }
</style>
</head>
<body>
<script src="site-data.js"></script>

<!--
  ✅ DÜZELTİLDİ: Ticker suppressor
  Harita sayfasında nav.js'in ticker'ını göstermiyoruz — topbar zaten istatistik içeriyor.
  nav.js, #tickerInner varsa kendi ticker'ını gizler.
-->
<div id="tickerInner" style="display:none;"></div>

<div id="nav-root"></div>
<script src="nav.js"></script>

<!-- ══════════ HARİTA GÖVDE ══════════ -->
<div class="harita-wrap">

  <!-- Üst bilgi şeridi -->
  <div class="harita-topbar">
    <div class="harita-title">EKOLOJİ <span>HARİTASI</span></div>

    <div class="harita-live">
      <span class="live-dot"></span>
      Canlı Veri
    </div>

    <div class="harita-stats" id="haritaStats">
      <div class="hstat"><b id="hStatIhlal">—</b> İhlal</div>
      <div class="hstat"><b id="hStatKritik">—</b> Kritik</div>
      <div class="hstat"><b id="hStatHafta">—</b> Bu Hafta</div>
    </div>

    <a href="https://ekoloji-izleme.com/harita/index.html"
       target="_blank" rel="noopener"
       class="btn-tam">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5">
        <polyline points="15 3 21 3 21 9"/>
        <polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/>
        <line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
      Tam Ekran
    </a>

    <a href="index.html" class="btn-geri">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
      Ana Sayfa
    </a>
  </div>

  <!-- Harita iframe -->
  <iframe
    id="haritaFrame"
    src="https://ekoloji-izleme.com/harita/index.html"
    title="Ekoloji Haritası — Tam Görünüm"
    loading="lazy"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
    allowfullscreen
  ></iframe>

</div>

<script>
// İstatistikleri localStorage'dan doldur
const ihlaller = SITE.get("ihlaller") || [];
document.getElementById("hStatIhlal").textContent  = ihlaller.length || "—";
document.getElementById("hStatKritik").textContent =
  ihlaller.filter(i => i.siddet === "kritik").length || "—";
document.getElementById("hStatHafta").textContent  =
  ihlaller.filter(i => i.tarih &&
    (Date.now() - new Date(i.tarih).getTime()) < 7 * 86400000
  ).length || "—";
</script>
</body>
</html>
