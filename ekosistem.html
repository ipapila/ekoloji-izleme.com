<style>
.page-header{background:var(--forest);padding:100px 80px 60px;border-bottom:1px solid rgba(45,158,107,.15);}
.page-header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,6vw,80px);color:var(--white);line-height:.9;margin-top:12px;}
.page-header h1 span{color:var(--bright);}

/* CONTENT + LAYOUT (haberler / ihlaller ile aynı desen) */
.content{background:var(--dark);padding:40px 80px 60px;min-height:60vh;}
.content-layout{display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:start;}

/* SOL SIDEBAR */
.kat-sidebar{position:sticky;top:80px;}
.kat-sidebar-title{font-family:"JetBrains Mono",monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 0 10px;border-bottom:1px solid rgba(45,158,107,.1);margin-bottom:8px;}
.kat-tumü{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:3px;cursor:pointer;transition:all .2s;border:1px solid rgba(45,158,107,.15);background:rgba(45,158,107,.05);margin-bottom:10px;}
.kat-tumü:hover{background:rgba(45,158,107,.12);}
.kat-tumü.aktif-kat{background:rgba(45,158,107,.15);border-color:rgba(45,158,107,.3);}
.kat-tumü span{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--bright);flex:1;}
.kat-tumü b{font-family:"JetBrains Mono",monospace;font-size:8px;color:var(--accent);}
.kat-separator{font-family:"JetBrains Mono",monospace;font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);opacity:.45;padding:12px 12px 5px;margin-top:4px;display:flex;align-items:center;gap:6px;}
.kat-grup-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.grup-canlilar .kat-grup-dot,.kat-item.grup-canlilar::before{background:var(--leaf);}
.grup-topluluklar .kat-grup-dot,.kat-item.grup-topluluklar::before{background:#d9b35c;}
.grup-adalet .kat-grup-dot,.kat-item.grup-adalet::before{background:#c97b6b;}
.kat-item{display:flex;align-items:center;gap:8px;padding:9px 12px 9px 10px;border-radius:3px;cursor:pointer;transition:all .2s;border:1px solid transparent;margin-bottom:2px;position:relative;}
.kat-item::before{content:'';width:2px;align-self:stretch;border-radius:1px;opacity:.35;flex-shrink:0;transition:opacity .2s;}
.kat-item:hover::before,.kat-item.aktif-kat::before{opacity:.9;}
.kat-item:hover{background:rgba(45,158,107,.07);border-color:rgba(45,158,107,.12);}
.kat-item.aktif-kat{background:rgba(45,158,107,.1);border-color:rgba(45,158,107,.25);}
.kat-item.aktif-kat .kat-ad{color:var(--bright);}
.kat-ikon{width:18px;font-size:12px;text-align:center;flex-shrink:0;line-height:1;}
.kat-ad{font-family:"JetBrains Mono",monospace;font-size:9.5px;color:var(--muted);flex:1;line-height:1.3;}
.kat-sayi{font-family:"JetBrains Mono",monospace;font-size:8px;color:var(--muted);opacity:.5;flex-shrink:0;}
.kat-item.aktif-kat .kat-sayi{opacity:.9;}

/* SAĞ ANA ALAN */
.liste-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.liste-baslik{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--cream);line-height:1;}
.search-box{padding:8px 14px;background:rgba(45,158,107,.07);border:1px solid rgba(45,158,107,.2);border-radius:3px;color:var(--cream);font-family:'JetBrains Mono',monospace;font-size:11px;outline:none;width:100%;box-sizing:border-box;margin-bottom:14px;}
.search-box:focus{border-color:var(--accent);}
.count-bar{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);margin-bottom:16px;}
.count-bar b{color:var(--bright);}
.admin-ekle-btn{padding:8px 16px;background:rgba(45,158,107,.12);color:var(--accent);border:1px solid rgba(45,158,107,.25);border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:9px;cursor:pointer;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap;}
.admin-ekle-btn:hover{background:rgba(45,158,107,.22);}

/* KAYIT LİSTESİ */
.kayit-list{display:flex;flex-direction:column;gap:2px;}
.kayit-row{background:var(--forest);border-left:3px solid rgba(45,158,107,.4);padding:20px 26px;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start;transition:all .2s;cursor:pointer;}
.kayit-row:hover{background:var(--deep);border-left-color:var(--accent);padding-left:32px;}
.kayit-row h4{font-size:15px;font-weight:400;color:var(--cream);margin-bottom:5px;}
.kayit-row .meta{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted);letter-spacing:.04em;}
.kayit-row .ozet{font-size:13.5px;color:rgba(122,158,138,.75);margin-top:6px;font-weight:300;line-height:1.6;}
.kayit-row .tarih{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(122,158,138,.45);text-align:right;white-space:nowrap;}
.admin-sil-btn{padding:3px 10px;background:rgba(232,92,42,.12);color:#e85c2a;border:1px solid rgba(232,92,42,.3);border-radius:2px;font-family:'JetBrains Mono',monospace;font-size:8px;cursor:pointer;}
.admin-sil-btn:hover{background:rgba(232,92,42,.25);}
.empty{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);padding:40px 0;letter-spacing:.05em;opacity:.6;}

/* MODAL */
.modal-bg{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(5px);}
.modal-bg.open{display:flex;}
.modal-box{background:var(--deep);border:1px solid rgba(45,158,107,.25);border-radius:8px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;}
.modal-header{padding:24px 30px 16px;display:flex;justify-content:space-between;align-items:start;position:sticky;top:0;background:var(--deep);border-bottom:1px solid rgba(45,158,107,.1);}
.modal-body{padding:24px 30px 36px;}
.modal-title{font-family:'Crimson Pro',serif;font-size:28px;font-weight:400;color:var(--cream);line-height:1.3;margin-bottom:14px;}
.modal-meta{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid rgba(45,158,107,.1);}
.modal-icerik{font-size:15px;font-weight:300;color:var(--cream);line-height:1.85;}
.modal-actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;}
.modal-btn{display:inline-flex;align-items:center;gap:7px;padding:10px 20px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;border-radius:4px;}
.modal-btn.primary{background:var(--accent);color:var(--dark);}
.modal-btn.outline{background:transparent;color:var(--cream);border:1px solid rgba(240,245,242,.2);}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;}

/* MOBİL: sidebar yatay şeride dönüşür (haberler/ihlaller ile aynı) */
@media(max-width:900px){
  .page-header{padding:80px 28px 40px;}
  .content{padding:24px 16px 40px;}
  .content-layout{grid-template-columns:1fr;}
  .kat-sidebar{position:static;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;}
  .kat-sidebar-title,.kat-separator{display:none;}
  .kat-tumü{margin-bottom:0;}
  .kat-item{padding:6px 10px;}
  .kat-sayi{display:none;}
  .liste-baslik{font-size:26px;}
}
</style>

<script src="site-data.js"></script>
<div id="nav-root"></div>
<script src="nav.js"></script>

<div class="page-header">
  <div class="section-tag">Canlı & Topluluk İzleme</div>
  <h1>EKOSİSTEM <span>&</span> TOPLULUKLAR</h1>
  <p class="page-subtitle" style="font-size:15px;color:var(--muted);margin-top:16px;font-weight:300;max-width:560px;">İnsan dışı canlılar, topluluklar ve çevre adaleti ekseninde belgeli izleme.</p>
</div>

<div class="content">
  <div class="content-layout">

    <aside class="kat-sidebar" id="katSidebar">
      <div class="kat-sidebar-title">Bölümler yükleniyor…</div>
    </aside>

    <div id="ekoMain">
      <div class="empty">Yükleniyor…</div>
    </div>

  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="detailModal" onclick="if(event.target===this)kapatModal()">
  <div class="modal-box">
    <div class="modal-header">
      <span id="mBolum" style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;"></span>
      <button class="modal-close" onclick="kapatModal()">✕</button>
    </div>
    <div class="modal-body">
      <h2 class="modal-title" id="mBaslik"></h2>
      <div class="modal-meta" id="mMeta"></div>
      <div class="modal-icerik" id="mIcerik"></div>
      <div class="modal-actions" id="mActions"></div>
    </div>
  </div>
</div>

<script>
/* ═══ BÖLÜM YAPISI ══════════════════════════════════════════════ */
const BOLUMLER = {
  "turler":         {ad:"Nesli Tehlike Altında Türler", grup:"İnsan Dışı Canlılar", icon:"🦅"},
  "yaban":          {ad:"Yaban Hayatı İzleme",          grup:"İnsan Dışı Canlılar", icon:"🐺"},
  "bitki":          {ad:"Bitki Örtüsü & Habitatlar",    grup:"İnsan Dışı Canlılar", icon:"🌿"},
  "su-canlilari":   {ad:"Su Canlıları",                 grup:"İnsan Dışı Canlılar", icon:"🐟"},
  "hayvan-haklari": {ad:"Hayvan Hakları & Refahı",      grup:"İnsan Dışı Canlılar", icon:"🐾"},
  "kadinlar":       {ad:"Kadınlar & Ekoloji",            grup:"İnsan Toplulukları",  icon:"♀"},
  "lgbti":          {ad:"LGBTİ+ & Çevre",               grup:"İnsan Toplulukları",  icon:"🏳️"},
  "engelliler":     {ad:"Engelliler & Erişim",           grup:"İnsan Toplulukları",  icon:"♿"},
  "ciftci":         {ad:"Çiftçi & Köylü Sorunları",     grup:"İnsan Toplulukları",  icon:"🌾"},
  "balikci":        {ad:"Balıkçı Toplulukları",          grup:"İnsan Toplulukları",  icon:"🎣"},
  "genclik":        {ad:"Çocuklar & Gençlik",            grup:"İnsan Toplulukları",  icon:"🌱"},
  "esitsizlik":     {ad:"Ekolojik Eşitsizlik",           grup:"Çevre Adaleti",       icon:"⚖️"},
  "kentsel":        {ad:"Kentsel Çevre",                 grup:"Çevre Adaleti",       icon:"🏙️"},
  "goc":            {ad:"İklim Göçü & Yerinden Edilme",  grup:"Çevre Adaleti",       icon:"🚶"},
  "savas":          {ad:"Savaş & Ekoloji",               grup:"Çevre Adaleti",       icon:"💥"},
  "savas-teknoloji":{ad:"Savaş Teknolojisi & Çevre",    grup:"Çevre Adaleti",       icon:"🛰️"},
};
const GRUPLAR = ["İnsan Dışı Canlılar", "İnsan Toplulukları", "Çevre Adaleti"];

let tumEkosistem = [];
let aktifSec = new URLSearchParams(location.search).get("sec") || "";
let arama = "";

/* ═══ SIDEBAR ════════════════════════════════════════════════════ */
function buildSidebar() {
  let html = `<div class="kat-sidebar-title">Bölüm Kategorileri</div>
    <div class="kat-tumü" data-sec="" onclick="setSec('')">
      <span>Tüm İçerik</span><b id="ks_toplam">…</b>
    </div>`;
  const GRUP_SINIF = {
    "İnsan Dışı Canlılar": "grup-canlilar",
    "İnsan Toplulukları":  "grup-topluluklar",
    "Çevre Adaleti":       "grup-adalet"
  };
  GRUPLAR.forEach(grup => {
    const gs = GRUP_SINIF[grup] || "";
    html += `<div class="kat-separator ${gs}"><span class="kat-grup-dot"></span>${grup}</div>`;
    Object.entries(BOLUMLER).filter(([,b]) => b.grup === grup).forEach(([sec, b]) => {
      html += `<div class="kat-item ${gs}" data-sec="${sec}" onclick="setSec('${sec}')">
        <span class="kat-ikon">${b.icon}</span>
        <span class="kat-ad">${b.ad}</span>
        <span class="kat-sayi" id="ks_${sec}">…</span>
      </div>`;
    });
  });
  document.getElementById("katSidebar").innerHTML = html;
  senkronSidebar();
}

function guncelleSayac() {
  const t = document.getElementById("ks_toplam");
  if (t) t.textContent = tumEkosistem.length;
  Object.keys(BOLUMLER).forEach(sec => {
    const el = document.getElementById("ks_" + sec);
    if (el) el.textContent = tumEkosistem.filter(k => k.bolum === sec).length;
  });
}

function senkronSidebar() {
  document.querySelectorAll("#katSidebar .kat-item, #katSidebar .kat-tumü")
    .forEach(el => el.classList.toggle("aktif-kat", (el.dataset.sec || "") === aktifSec));
}

function setSec(sec) {
  aktifSec = sec;
  const url = sec ? location.pathname + "?sec=" + sec : location.pathname;
  history.pushState({}, "", url);
  arama = "";
  senkronSidebar();
  renderShell();
}

/* ═══ AKTİF KAYITLAR ═════════════════════════════════════════════ */
function aktifKayitlar() {
  let liste = aktifSec ? tumEkosistem.filter(k => k.bolum === aktifSec) : tumEkosistem;
  if (arama) {
    const q = arama.toLowerCase();
    liste = liste.filter(k => ((k.baslik||"") + (k.ozet||"") + (k.kaynak||"") + (k.konum||"")).toLowerCase().includes(q));
  }
  return liste;
}

/* ═══ RENDER: ana alan kabuğu ════════════════════════════════════ */
function renderShell() {
  const admin = typeof SITE !== "undefined" && SITE.isAdmin();
  const b = aktifSec && BOLUMLER[aktifSec];
  const baslik = b ? b.icon + " " + b.ad : "Tüm İçerik";
  document.getElementById("ekoMain").innerHTML = `
    <div class="liste-head">
      <h2 class="liste-baslik">${baslik}</h2>
      ${admin ? `<a class="admin-ekle-btn" href="admin.html#ekosistem">+ Kayıt Ekle</a>` : ""}
    </div>
    <input class="search-box" id="aramaKutu" placeholder="Ara…">
    <div class="count-bar" id="ekoCount"></div>
    <div class="kayit-list" id="kayitList"></div>`;
  const kutu = document.getElementById("aramaKutu");
  kutu.value = arama;
  kutu.addEventListener("input", e => { arama = e.target.value; renderKayitlar(); });
  renderKayitlar();
}

/* ═══ RENDER: kayıt listesi (arama bunu çağırır) ════════════════ */
function renderKayitlar() {
  const admin = typeof SITE !== "undefined" && SITE.isAdmin();
  const liste = aktifKayitlar();
  const cnt = document.getElementById("ekoCount");
  const ozel = liste.filter(k => !k._kaynak_kol).length;
  const diger = liste.filter(k => k._kaynak_kol).length;
  if (cnt) cnt.innerHTML = (ozel > 0 && diger > 0)
    ? `<b>${liste.length}</b> kayıt <span style="opacity:.5">(${ozel} ekosistem + ${diger} diğer kaynak)</span>`
    : `<b>${liste.length}</b> kayıt`;
  const el = document.getElementById("kayitList");
  if (!liste.length) { el.innerHTML = '<div class="empty">Bu bölümde henüz kayıt yok.</div>'; return; }
  const kolAd = {haberler:"haber",raporlar:"rapor",makaleler:"makale",uluslararasi:"uluslararası"};
  el.innerHTML = liste.map(k => `
    <div class="kayit-row" onclick="acModal('${k.id}')">
      <div>
        <h4>${k.baslik || ""}</h4>
        <div class="meta">${k.kaynak||""}${k.konum?" · "+k.konum:""}${k._kaynak_kol?` <span style="opacity:.5;font-size:8.5px;">(${kolAd[k._kaynak_kol]||k._kaynak_kol})</span>`:""}</div>
        ${k.ozet ? `<div class="ozet">${k.ozet.slice(0,180)}${k.ozet.length>180?"…":""}</div>` : ""}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
        <span class="tarih">${k.tarih ? new Date(k.tarih).toLocaleDateString("tr-TR",{day:"numeric",month:"short",year:"numeric"}) : ""}</span>
        ${admin ? `<button class="admin-sil-btn" onclick="event.stopPropagation();kayitSilEkosistem('${k.id}')">SİL</button>` : ""}
      </div>
    </div>`).join("");
}

/* ═══ MODAL ══════════════════════════════════════════════════════ */
function acModal(id) {
  const k = tumEkosistem.find(x => String(x.id) === String(id)); if (!k) return;
  document.getElementById("mBolum").textContent = BOLUMLER[k.bolum]?.ad || k.bolum || "";
  document.getElementById("mBaslik").textContent = k.baslik || "";
  const tarihStr = k.tarih ? new Date(k.tarih).toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"}) : "";
  const kolAd = {haberler:"Haberler",raporlar:"Raporlar",makaleler:"Makaleler",uluslararasi:"Uluslararası Medya"};
  document.getElementById("mMeta").innerHTML =
    (k.kaynak ? `<span>📌 ${k.kaynak}</span>` : "") +
    (tarihStr  ? `<span>📅 ${tarihStr}</span>` : "") +
    (k.konum   ? `<span>📍 ${k.konum}</span>` : "") +
    (k._kaynak_kol ? `<span style="opacity:.6">📂 ${kolAd[k._kaynak_kol]||k._kaynak_kol}</span>` : "");
  const metin = k.icerik || k.ozet || "";
  const fotoHtml = k.foto_url ? `<img src="${k.foto_url}" onerror="this.style.display='none'" style="width:100%;max-height:260px;object-fit:cover;border-radius:5px;margin-bottom:14px;border:1px solid rgba(45,158,107,.15);">` : "";
  document.getElementById("mIcerik").innerHTML = fotoHtml +
    (metin ? metin.split(/\n{2,}/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("") : '<p style="opacity:.5">İçerik yok.</p>');
  const act = document.getElementById("mActions"); act.innerHTML = "";
  if (k.url)   act.innerHTML += `<a href="${k.url}"   target="_blank" rel="noopener" class="modal-btn primary">Kaynağa Git →</a>`;
  if (k.dosya) act.innerHTML += `<a href="${k.dosya}" target="_blank" rel="noopener" class="modal-btn outline">📄 Dosyayı Aç</a>`;
  document.getElementById("detailModal").classList.add("open");
}
function kapatModal() { document.getElementById("detailModal").classList.remove("open"); }
document.addEventListener("keydown", e => { if (e.key === "Escape") kapatModal(); });

/* ═══ SİLME ══════════════════════════════════════════════════════ */
function getSilinen() {
  try { return new Set(JSON.parse(localStorage.getItem("ekoloji_ekosistem_silinen")||"[]").map(String)); }
  catch { return new Set(); }
}
function kayitSilEkosistem(id) {
  if (!confirm("Bu kaydı silmek istiyor musunuz?")) return;
  const sid = String(id);
  if (typeof SITE !== "undefined") SITE.set("ekosistem", (SITE.get("ekosistem")||[]).filter(x=>String(x.id)!==sid));
  const s = getSilinen(); s.add(sid);
  localStorage.setItem("ekoloji_ekosistem_silinen", JSON.stringify([...s]));
  tumEkosistem = tumEkosistem.filter(x => String(x.id) !== sid);
  guncelleSayac();
  renderKayitlar();
}

/* ═══ ETİKET → BÖLÜM HARİTASI ═══════════════════════════════════ */
const ETIKET_BOLUM_MAP = {
  "Nesli Tehlike Altında Türler":"turler",
  "Yaban Hayatı İzleme":"yaban","Yaban Hayatı":"yaban",
  "Bitki Örtüsü & Habitatlar":"bitki","Bitki Örtüsü":"bitki",
  "Su Canlıları":"su-canlilari",
  "Hayvan Hakları & Refahı":"hayvan-haklari",
  "Kadınlar & Ekoloji":"kadinlar",
  "LGBTİ+ & Çevre":"lgbti",
  "Engelliler & Erişim":"engelliler",
  "Çiftçi & Köylü Sorunları":"ciftci","Çiftçi & Köylü Hakları":"ciftci",
  "Balıkçı Toplulukları":"balikci",
  "Çocuklar & Gençlik":"genclik",
  "Ekolojik Eşitsizlik":"esitsizlik",
  "Kentsel Çevre":"kentsel",
  "İklim Göçü & Yerinden Edilme":"goc",
  "Savaş & Ekoloji":"savas",
  "Savaş Teknolojisi & Çevre":"savas-teknoloji",
};

function bolumKodBul(kayit) {
  if (kayit.bolum) return kayit.bolum;
  const etiketler = Array.isArray(kayit.etiketler) ? kayit.etiketler : [];
  for (const et of etiketler) {
    const kod = ETIKET_BOLUM_MAP[et];
    if (kod) return kod;
  }
  return null;
}

/* ═══ DİĞER KAYNAKLARDAN ETİKETLİ KAYITLARI TOPLA ═══════════════ */
function digerKaynaklardan(data) {
  const kollar = ["haberler","raporlar","makaleler","uluslararasi","ekosistem"];
  const goruldu = new Set(tumEkosistem.map(k => String(k.id)));
  const ekstra = [];
  kollar.forEach(kol => {
    (data[kol] || []).forEach(kayit => {
      const kod = bolumKodBul(kayit);
      if (!kod) return;
      const uid = kol + "_" + kayit.id;
      if (goruldu.has(uid)) return;
      goruldu.add(uid);
      ekstra.push({ ...kayit, id: uid, bolum: kod, _kaynak_kol: kol });
    });
  });
  return ekstra;
}

/* ═══ VERİ YÜKLEME ═══════════════════════════════════════════════ */
const EKOSISTEM_URL    = "https://raw.githubusercontent.com/ipapila/ekoloji-izleme.com/main/ekosistem.json";
const HABERLER_URL_EKO = "https://raw.githubusercontent.com/ipapila/ekoloji-izleme.com/main/haberler.json";

const silinen = getSilinen();
const lsData  = (typeof SITE !== "undefined" ? (SITE.get("ekosistem") || []) : [])
  .filter(k => !silinen.has(String(k.id)));

function renderSayfa() { guncelleSayac(); renderShell(); }

function haberlerdenEkle(habData) {
  const ekstra = digerKaynaklardan(habData);
  const lsIds  = new Set(lsData.map(k => String(k.id)));
  tumEkosistem = [
    ...lsData,
    ...tumEkosistem.filter(k => !lsIds.has(String(k.id))),
    ...ekstra,
  ].sort((a,b) => new Date(b.tarih||0) - new Date(a.tarih||0));
  renderSayfa();
}

// sidebar'ı hemen kur (sayaçlar veri gelince dolacak)
buildSidebar();

// 1) ekosistem.json → 2) haberler.json'dan etiketlileri ekle
fetch(EKOSISTEM_URL + "?v=" + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(data => {
    const sunucu = (data.ekosistem || []).filter(k => !silinen.has(String(k.id)));
    const lsIds  = new Set(lsData.map(k => String(k.id)));
    tumEkosistem = [...lsData, ...sunucu.filter(k => !lsIds.has(String(k.id)))];
    return fetch(HABERLER_URL_EKO + "?v=" + Date.now())
      .then(r => r.ok ? r.json() : {})
      .then(habData => haberlerdenEkle(habData));
  })
  .catch(() => {
    fetch(HABERLER_URL_EKO + "?v=" + Date.now())
      .then(r => r.ok ? r.json() : Promise.reject())
      .then(habData => haberlerdenEkle(habData))
      .catch(() => { tumEkosistem = lsData; renderSayfa(); });
  });

window.addEventListener("popstate", () => {
  aktifSec = new URLSearchParams(location.search).get("sec") || "";
  arama = "";
  senkronSidebar();
  renderShell();
});
</script>
