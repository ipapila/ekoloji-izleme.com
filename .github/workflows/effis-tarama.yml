name: Yangin Taramasi (EFFIS)
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'   # 3 saatte bir (UTC) — EFFIS risk/poligon verisi günlük güncellendiği için saatlik FIRMS taraması kadar sık gerekmiyor
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: EFFIS Taramasını Çalıştır
        run: python effis_tarama.py

      - name: Sonucu Plesk'e Gönder
        env:
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          for dosya in effis_yangin_riski.json effis_yangin_alanlari.geojson; do
            if [ -f "$dosya" ]; then
              HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
                -X POST "${SITE_URL}/upload.php" \
                -F "secret=${UPLOAD_SECRET}" \
                -F "klasor=kok" \
                -F "dosya=@${dosya}")
              echo "HTTP $HTTP_CODE → $dosya → $(cat /tmp/response.txt)"
            else
              echo "⚠ $dosya üretilmedi, atlanıyor"
            fi
          done
