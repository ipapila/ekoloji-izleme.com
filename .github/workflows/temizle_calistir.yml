name: Veri Temizle (Tek Seferlik)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  temizle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Bağımlılıkları yükle
        run: pip install requests
      - name: Temizle (RES + açıklamasız kayıtlar)
        run: python scripts/temizle.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
