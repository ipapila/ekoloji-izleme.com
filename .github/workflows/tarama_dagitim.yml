name: Günlük Tarama ve Dağıtım

on:
  schedule:
    - cron: '0 4 * * *'   # Her gün 04:00 UTC (07:00 Türkiye)
  workflow_dispatch:        # Manuel tetikleme

jobs:
  tara-ve-dagit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları yükle
        run: pip install feedparser requests beautifulsoup4 lxml

      - name: Tara
        run: python scripts/tarayici.py --cikti haberler.json

      - name: Dağıt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/dagitici.py

      - name: Rapor üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/rapor_uret.py

      - name: Değişiklikleri commit et ve push'la
        run: |
          git config user.name  "ekoloji-bot"
          git config user.email "bot@ekoloji-izleme.com"
          git add haberler.json ihlaller.json raporlar.json makaleler.json kuresel.json ekosistem.json rapor.json || true
          git diff --staged --quiet || git commit -m "otomatik tarama: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
