name: Veri Güncelleme + Flex Push

on:
  schedule:
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları yükle
        run: pip install requests beautifulsoup4 lxml

      - name: Haberleri güncelle (guncelle.py)
        run: python scripts/guncelle.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Güncel data.json'u GitHub'dan indir
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/data.json" \
            -o data.json
          echo "data.json boyutu: $(wc -c < data.json) byte"
          echo "Haber sayısı : $(python3 -c "import json; d=json.load(open('data.json')); print(len(d.get('haberler',[])))";)"

      - name: data.json'u Flex sunucuya gönder
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/webhook_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.FLEX_WEBHOOK_URL }}" \
            -H "X-Webhook-Secret: ${{ secrets.FLEX_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            --data-binary @data.json)
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/webhook_response.txt
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️  Webhook başarısız (HTTP $HTTP_STATUS)"
          else
            echo "✅ Flex sunucu güncellendi."
          fi
