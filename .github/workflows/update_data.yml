name: Veri Güncelleme + Flex Push
on:
  push:
    paths:
      - 'icerik.json'
  schedule:
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Bağımlılıkları yükle
        run: pip install requests beautifulsoup4 lxml

      - name: Haberleri güncelle (guncelle.py)
        run: python scripts/guncelle.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Değişiklikleri commit et
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Var olan dosyaları ekle (yoksa sessizce geç)
          for F in data.json ihlaller.json; do
            [ -f "$F" ] && git add "$F" && echo "$F eklendi" || echo "$F yok, atlandı"
          done
          # Değişiklik yoksa commit atla
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "auto: data.json güncellendi $(date -u '+%Y-%m-%d %H:%M') UTC"
          fi
          # Push öncesi uzaktaki değişiklikleri al (conflict önleme)
          git pull --rebase origin main
          git push origin main

      - name: data.json + ihlaller.json Flex sunucuya gönder
        run: |
          for DOSYA in data.json ihlaller.json; do
            if [ ! -f "$DOSYA" ]; then
              echo "$DOSYA bulunamadı, atlanıyor."
              continue
            fi
            echo "$DOSYA Flex'e gönderiliyor..."
            HTTP_STATUS=$(curl -s -o /tmp/flex_resp.txt -w "%{http_code}" \
              -X POST "${{ secrets.FLEX_WEBHOOK_URL }}?dosya=${DOSYA}" \
              -H "X-Webhook-Secret: ${{ secrets.FLEX_WEBHOOK_SECRET }}" \
              -H "Content-Type: application/json" \
              --data-binary @"$DOSYA")
            echo "HTTP Status: $HTTP_STATUS"
            cat /tmp/flex_resp.txt
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "$DOSYA Flex gönderimi başarısız (HTTP $HTTP_STATUS)"
            else
              echo "$DOSYA Flex'e gönderildi."
            fi
          done

      - name: icerik.json varsa Flex'e gönder
        run: |
          if [ -f icerik.json ]; then
            HTTP_STATUS=$(curl -s -o /tmp/icerik_resp.txt -w "%{http_code}" \
              -X POST "${{ secrets.FLEX_WEBHOOK_URL }}?dosya=icerik.json" \
              -H "X-Webhook-Secret: ${{ secrets.FLEX_WEBHOOK_SECRET }}" \
              -H "Content-Type: application/json" \
              --data-binary @icerik.json)
            echo "icerik.json HTTP Status: $HTTP_STATUS"
            cat /tmp/icerik_resp.txt
          else
            echo "icerik.json bulunamadı, atlanıyor."
          fi

      - name: data.json + ihlaller.json Plesk'e gönder
        env:
          UPLOAD_TOKEN: ${{ secrets.PLESK_UPLOAD_TOKEN }}
          UPLOAD_URL:   ${{ secrets.PLESK_UPLOAD_URL }}
        run: |
          for DOSYA in data.json ihlaller.json; do
            if [ ! -f "$DOSYA" ]; then
              echo "$DOSYA bulunamadı, atlanıyor."
              continue
            fi
            echo "$DOSYA Plesk'e gönderiliyor..."
            HTTP_STATUS=$(curl -s -o /tmp/plesk_resp.json -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              --data-binary @"$DOSYA" \
              "${UPLOAD_URL}?file=${DOSYA}&token=${UPLOAD_TOKEN}")
            echo "HTTP durum: ${HTTP_STATUS}"
            cat /tmp/plesk_resp.json
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "$DOSYA Plesk yükleme başarısız (HTTP ${HTTP_STATUS})"
            else
              echo "$DOSYA Plesk'e yüklendi."
            fi
          done
