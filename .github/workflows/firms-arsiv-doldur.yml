name: Yangin Arsiv Doldurma (FIRMS, tek seferlik)
on:
  workflow_dispatch:
    inputs:
      gun_sayisi:
        description: 'Geriye dönük kaç gün (varsayılan 10, FIRMS NRT genelde ~60 güne kadar destekler)'
        required: false
        default: '10'
      geocode:
        description: 'İl/ilçe/yerleşim için Nominatim geocoding açılsın mı? (yavaş)'
        required: false
        default: 'false'
jobs:
  doldur:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Arşiv Doldurma Scriptini Çalıştır
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          ARGS="${{ github.event.inputs.gun_sayisi }}"
          if [ "${{ github.event.inputs.geocode }}" = "true" ]; then
            ARGS="$ARGS --geocode"
          fi
          python firms_arsiv_doldur.py $ARGS

      - name: Arşiv Dosyalarını Plesk'e Gönder
        env:
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -d "arsiv" ]; then
            for dosya in arsiv/*.json; do
              [ -f "$dosya" ] || continue
              HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
                -X POST "${SITE_URL}/upload.php" \
                -F "secret=${UPLOAD_SECRET}" \
                -F "klasor=arsiv" \
                -F "dosya=@${dosya}")
              echo "HTTP $HTTP_CODE → $dosya → $(cat /tmp/response.txt)"
            done
          else
            echo "⚠ arsiv/ klasörü üretilmedi, atlanıyor"
          fi
