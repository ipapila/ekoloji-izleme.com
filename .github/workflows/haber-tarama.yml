name: Haber Tarama
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: write
jobs:
  tara:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Bagımlılıkları yükle
        run: pip install requests beautifulsoup4 lxml feedparser
      - name: Haberleri tara
        run: python scripts/tarayici.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: haberler.json dogrula
        run: |
          if [ ! -f haberler.json ]; then
            echo "haberler.json olusturulmadi, atlanıyor"
            exit 0
          fi
          python3 -c "import json,sys; d=json.load(open('haberler.json',encoding='utf-8')); print('OK:', len(d.get('haberler',[])), 'haber')" || exit 1
      - name: JSON dosyalarını Plesk'e gönder
        env:
          UPLOAD_TOKEN: ${{ secrets.PLESK_UPLOAD_TOKEN }}
          UPLOAD_URL:   ${{ secrets.PLESK_UPLOAD_URL }}
        run: |
          for DOSYA in haberler_veri.json raporlar_veri.json makaleler_veri.json uluslararasi_veri.json ekosistem_veri.json; do
            if [ ! -f "$DOSYA" ]; then
              echo "$DOSYA bulunamadı, atlanıyor."
              continue
            fi
            echo "$DOSYA gönderiliyor..."
            HTTP_STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              --data-binary @"$DOSYA" \
              "${UPLOAD_URL}?file=${DOSYA}&token=${UPLOAD_TOKEN}")
            echo "HTTP: ${HTTP_STATUS}"
            cat /tmp/resp.json
          done
          echo "📤 haberler.json Plesk'e gönderiliyor..."
          HTTP_STATUS=$(curl -s -o /tmp/upload_response.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @haberler.json \
            "${UPLOAD_URL}?file=h
