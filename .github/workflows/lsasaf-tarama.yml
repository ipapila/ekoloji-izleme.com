name: Yangin Erken Sinyal (LSA SAF/MSG)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'   # her 15 dakikada bir (UTC) - SEVIRI tarama ritmiyle uyumlu
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Kur
        run: pip install netCDF4 requests

      - name: LSA SAF Erken Sinyal Taramasını Çalıştır
        env:
          LSASAF_USER: ${{ secrets.LSASAF_USER }}
          LSASAF_PASS: ${{ secrets.LSASAF_PASS }}
        run: python lsasaf_erken_sinyal.py

      - name: Sonucu Plesk'e Gönder
        env:
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -f "lsasaf_erken_sinyal.json" ]; then
            HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
              -X POST "${SITE_URL}/upload.php" \
              -F "secret=${UPLOAD_SECRET}" \
              -F "klasor=kok" \
              -F "dosya=@lsasaf_erken_sinyal.json")
            echo "HTTP $HTTP_CODE -> lsasaf_erken_sinyal.json -> $(cat /tmp/response.txt)"
          else
            echo "uyari: lsasaf_erken_sinyal.json uretilmedi, atlaniyor"
          fi
