name: Yangin Taramasi (LSA SAF FRP-PIXEL, Meteosat)
on:
  workflow_dispatch:
    inputs:
      inspect:
        description: 'Sadece HDF5 yapısını incele (dataset adlarını doğrula), veri üretme'
        required: false
        default: 'false'
  schedule:
    - cron: '15 * * * *'   # saatlik

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Kur
        run: pip install h5py requests

      - name: LSA SAF Taramasını Çalıştır
        env:
          LSA_USER: ${{ secrets.LSA_USER }}
          LSA_PASS: ${{ secrets.LSA_PASS }}
        run: |
          if [ "${{ github.event.inputs.inspect }}" = "true" ]; then
            python lsasaf_frp_tarama.py --inspect
          else
            python lsasaf_frp_tarama.py
          fi

      - name: Sonucu Plesk'e Gönder
        if: ${{ github.event.inputs.inspect != 'true' }}
        env:
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          for dosya in lsasaf_frp.json lsasaf_frp.geojson; do
            if [ -f "$dosya" ]; then
              HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
                -X POST "${SITE_URL}/upload.php" \
                -F "secret=${UPLOAD_SECRET}" \
                -F "klasor=kok" \
                -F "dosya=@${dosya}")
              echo "HTTP $HTTP_CODE → $dosya → $(cat /tmp/response.txt)"
            else
              echo "⚠ $dosya üretilmedi, atlanıyor"
            fi
          done
