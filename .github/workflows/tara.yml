name: Tara (Veri + Haberler)

# Yalnızca manuel tetikleme — zamanlamayı diğer workflow'lar yönetiyor.
# GitHub Actions → "Run workflow" butonuyla tek tıkla her ikisi başlar.
on:
  workflow_dispatch:

jobs:

  # ── Veri güncelle (guncelle.py → data.json → Flex) ─────────────────────
  veri-guncelle:
    uses: ./.github/workflows/update_data.yml
    secrets: inherit        # GITHUB_TOKEN, FLEX_WEBHOOK_URL, FLEX_WEBHOOK_SECRET

  # ── Haber tara (tarayici.py → haberler.json → commit) ───────────────────
  haber-tara:
    uses: ./.github/workflows/haber-tarama.yml
    secrets: inherit        # GITHUB_TOKEN

  # ── Özet — her ikisi bittikten sonra çalışır ────────────────────────────
  ozet:
    needs: [veri-guncelle, haber-tara]
    runs-on: ubuntu-latest
    steps:
      - name: Tara tamamlandı
        run: |
          echo "✅ Her iki tarama tamamlandı."
          echo "   • Veri (data.json + Flex): ${{ needs.veri-guncelle.result }}"
          echo "   • Haberler (haberler.json): ${{ needs.haber-tara.result }}"
