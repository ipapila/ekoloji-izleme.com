name: Tara (Veri + Haberler + Rapor)
# Yalnızca manuel tetikleme — zamanlamayı diğer workflow'lar yönetiyor.
# GitHub Actions → "Run workflow" butonuyla tek tıkla üçü birden başlar.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  # ── Veri güncelle (guncelle.py → data.json → Flex + Plesk) ─────────────
  veri-guncelle:
    uses: ./.github/workflows/update_data.yml
    secrets: inherit
  # ── Haber tara (tarayici.py → haberler.json → Plesk) ───────────────────
  haber-tara:
    uses: ./.github/workflows/haber-tarama.yml
    secrets: inherit
  # ── Günlük rapor (rapor_uret.py → rapor.json → Plesk) ──────────────────
  rapor-uret:
    uses: ./.github/workflows/rapor.yml
    secrets: inherit
  # ── Özet — üçü bittikten sonra çalışır ─────────────────────────────────
  ozet:
    needs: [veri-guncelle, haber-tara, rapor-uret]
    runs-on: ubuntu-latest
    steps:
      - name: Tara tamamlandı
        run: |
          echo "✅ Tüm taramalar tamamlandı."
          echo "   • Veri (data.json + ihlaller.json): ${{ needs.veri-guncelle.result }}"
          echo "   • Haberler (haberler.json): ${{ needs.haber-tara.result }}"
          echo "   • Rapor (rapor.json): ${{ needs.rapor-uret.result }}"
