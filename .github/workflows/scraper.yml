name: Ekoloji Izleme Botu v7

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  tara-ve-gonder:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          pip install requests beautifulsoup4 feedparser urllib3 lxml anthropic

      - name: Tarayıcıyı Çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python tarayici.py --cikti haberler.json

      - name: Dağıtıcıyı Çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python dagitici.py

      - name: JSON'ları Repo'ya Commit Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -f haberler.json ihlaller.json raporlar.json makaleler.json ekosistem.json kuresel.json data.json || true
          git diff --staged --quiet || git commit -m "Oto-Veri: $(date +'%Y-%m-%d %H:%M UTC')"
          git push || true

      - name: JSON'ları Plesk'e Gönder
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          HATALI=0
          for dosya in haberler.json ihlaller.json raporlar.json makaleler.json ekosistem.json kuresel.json data.json; do
            if [ ! -f "$dosya" ]; then continue; fi
            BOYUT=$(wc -c < "$dosya")
            echo "→ $dosya gönderiliyor... (${BOYUT} byte)"
            for deneme in 1 2 3; do
              HTTP_STATUS=$(curl -s -o /tmp/webhook_yanit.txt -w "%{http_code}" \
                --max-time 60 \
                -X POST \
                -H "Content-Type: application/json" \
                -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
                --data-binary "@${dosya}" \
                "${WEBHOOK_URL}?dosya=${dosya}" 2>/dev/null || echo "000")
              echo "  Deneme ${deneme}: HTTP ${HTTP_STATUS}"
              if [ "$HTTP_STATUS" = "200" ]; then break; fi
              if [ "$deneme" -lt 3 ]; then sleep 5; fi
            done
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "  YANIT: $(cat /tmp/webhook_yanit.txt 2>/dev/null)"
              HATALI=$((HATALI+1))
            fi
          done
          if [ "$HATALI" -gt 0 ]; then
            echo "⚠ ${HATALI} dosya gönderilemedi."
          else
            echo "✓ Tüm dosyalar başarıyla gönderildi."
          fi
