name: Ekoloji Izleme Botu v5

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Repo Kodlarını Çek
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        pip install requests beautifulsoup4 feedparser urllib3 lxml

    - name: Botu Çalıştır ve Veri Üret
      run: |
        python scripts/tarayici.py --cikti data.json

    - name: Üretilen JSON Verilerini GitHub Reposuna Commit Et
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Oto-Veri Güncellemesi: $(date +'%Y-%m-%d %H:%M')" && git push)

    - name: Verileri Plesk Sunucusuna SFTP (SSH) ile Güvenli Gönder
      uses: sshpool/sftp-deploy-action@v1.3.1
      with:
        host: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22 # Standart güvenli SSH portu
        local-dir: './'
        # ⚠️ Buraya Plesk'teki HTTPDOCS klasörünün sunucudaki tam yolunu yazıyoruz:
        server-dir: '/var/www/vhosts/ekoloji-izleme.com/httpdocs/'
        # Sadece bizim ürettiğimiz güncel veri dosyasını fırlatması için:
        include: '["data.json"]'
