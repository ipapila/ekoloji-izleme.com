name: Ekoloji Izleme Botu v6

on:
  push:
    branches:
      - main  # Her commit attığında bot otomatik çalışır
  workflow_dispatch: # Manuel tetikleme hala kalsın
  schedule:
    - cron: '0 */6 * * *'

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Repo Kodlarını Çek
      uses: actions/checkout@v4
      
    # ... geri kalan adımlar aynı ...

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        pip install requests beautifulsoup4 feedparser urllib3 lxml

    - name: Botu Çalıştır ve Veri Üret
      run: |
        python scripts/tarayici.py --cikti data.json

    - name: Üretilen JSON Verilerini GitHub Reposuna Commit Et
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Oto-Veri Güncellemesi: $(date +'%Y-%m-%d %H:%M')" && git push)

    - name: Verileri Plesk Sunucusuna Güvenli SSH (SFTP) ile Gönder
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 22 # Güvenli SSH portu
        source: "data.json"
        # ⚠️ Buraya Plesk'teki ana dizinin sunucudaki tam fiziksel yolunu yazıyoruz:
        target: "/var/www/vhosts/ekoloji-izleme.com/httpdocs/"
