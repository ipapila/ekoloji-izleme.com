name: Ekoloji Izleme Botu v8
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  tara-ve-gonder:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          pip install requests beautifulsoup4 feedparser urllib3 lxml anthropic

      - name: Tarayıcıyı Çalıştır
        timeout-minutes: 20
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python tarayici.py --cikti haberler.json

      - name: Dağıtıcıyı Çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python dagitici.py

      - name: Firebase İhlal Export
        run: |
          if [ -f "scripts/firebase_ihlal_export.py" ]; then
            echo "scripts/ klasöründen çalıştırılıyor"
            python scripts/firebase_ihlal_export.py
          elif [ -f "firebase_ihlal_export.py" ]; then
            echo "Ana dizinden çalıştırılıyor"
            python firebase_ihlal_export.py
          else
            echo "⚠ firebase_ihlal_export.py bulunamadı — scripti repoya ekle!"
            exit 1
          fi

      - name: JSON'ları Repo'ya Commit Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add -A -- '*.json' || git add -f haberler.json ihlaller.json data.json || true
          git diff --staged --quiet || git commit -m "Oto-Veri: $(date +'%Y-%m-%d %H:%M UTC')"
          git push || true
