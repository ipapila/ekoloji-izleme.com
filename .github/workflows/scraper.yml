name: Ekoloji Izleme Botu v7

on:
  workflow_dispatch:       # Admin panelinden manuel tetikleme
  schedule:
    - cron: '0 */6 * * *'  # Her 6 saatte bir otomatik

jobs:
  tara-ve-gonder:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ── 1. Repo'yu çek ────────────────────────────────────────────────
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      # ── 2. Python kur ─────────────────────────────────────────────────
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Bağımlılıklar ──────────────────────────────────────────────
      - name: Bağımlılıkları Yükle
        run: |
          pip install requests beautifulsoup4 feedparser urllib3 lxml anthropic

      # ── 4. Tarayıcıyı çalıştır ────────────────────────────────────────
      - name: Tarayıcıyı Çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python tarayici.py --cikti haberler.json

      # ── 5. Dağıtıcıyı çalıştır ───────────────────────────────────────
      - name: Dağıtıcıyı Çalıştır
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python dagitici.py

      # ── 6. JSON'ları repo'ya commit et ───────────────────────────────
      - name: JSON'ları Repo'ya Commit Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add haberler.json ihlaller.json raporlar.json makaleler.json ekosistem.json kuresel.json data.json || true
          git diff --staged --quiet || git commit -m "Oto-Veri: $(date +'%Y-%m-%d %H:%M UTC')"
          git push || true

      # ── 7. Tüm JSON'ları Plesk webhook'a gönder ──────────────────────
      - name: JSON'ları Plesk'e Gönder
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          for dosya in haberler.json ihlaller.json raporlar.json makaleler.json ekosistem.json kuresel.json data.json; do
            if [ -f "$dosya" ]; then
              echo "→ $dosya gönderiliyor..."
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                -X POST \
                -H "Content-Type: application/json" \
                -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
                --data-binary "@${dosya}" \
                "${WEBHOOK_URL}?dosya=${dosya}")
              echo "  HTTP ${HTTP_STATUS}"
            fi
          done
          echo "✓ Tüm dosyalar gönderildi."
