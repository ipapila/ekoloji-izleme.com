name: Ekoloji Izleme Botu

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir çalışır
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Repo Kodlarını Çek
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        pip install requests beautifulsoup4 feedparser urllib3

    - name: Botu Çalıştır ve Veri Üret
      run: |
        python cbs_proxy.py --output data

    - name: Üretilen Veriyi GitHub Reposuna Commit Et
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add data/*.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Oto-Veri Güncellemesi: $(date +'%Y-%m-%d %H:%M')"
        git push

    - name: Verileri Plesk Sunucusuna Yükle (FTP Deployment)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}       # Plesk FTP Sunucu Adresi (örn: ftp.ekoloji-izleme.com)
        username: ${{ secrets.FTP_USERNAME }}   # Plesk FTP Kullanıcı Adı
        password: ${{ secrets.FTP_PASSWORD }}   # Plesk FTP Şifresi
        local-dir: ./data/                      # GitHub'daki veri klasörü
        server-dir: ./httpdocs/data/            # Plesk'teki hedef klasör
        state-name: .ftp-deploy-data-state.json
