name: Günlük Rapor
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  rapor-uret:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: Raporu üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME:  ${{ github.event.repository.name }}
        run: python scripts/rapor_uret.py

      - name: Commit ve push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Günlük rapor: $(date +'%Y-%m-%d')"
          git pull --rebase
          git push

      - name: rapor.json'u Plesk sunucuya gönder
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/webhook_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.FLEX_WEBHOOK_URL }}?dosya=rapor.json" \
            -H "X-Webhook-Secret: ${{ secrets.FLEX_WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            --data-binary @rapor.json)
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/webhook_response.txt
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️ Webhook başarısız (HTTP $HTTP_STATUS) — workflow devam ediyor."
          else
            echo "✅ Plesk güncellendi: rapor.json"
          fi
