Araştırdı workflow başarısı rağmen çıktı eksikliğinin nedenini
GitHub Actions logunu görmeden kesin söylemek zor, ama bu tür "action çalıştı ama sayfaya bir şey gelmiyor" sorunlarının birkaç klasik nedeni var. Önce mevcut scripti görmem gerekiyor.


Rapor_uret.py dosyasını bul
Rapor_uret.py dosyasını bul
Script yüklü değil. O zaman en yaygın nedenleri sıralayalım ve adım adım teşhis edelim.

Olası Nedenler
1. Script bir dosya üretiyor ama Git'e commit etmiyor
En sık karşılaşılan sorun bu. Script çalışır, bir HTML/JSON dosyası yazar, ama bu dosya repository'ye push edilmez — Action bitince her şey silinir.

Workflow'una şu adımı eklemen gerekir:

yaml
      - name: Değişiklikleri commit et ve push'la
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Günlük rapor: $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
2. GitHub Pages doğru klasörü yayınlamıyor
Eğer sayfa GitHub Pages üzerinden yayınlanıyorsa, Pages ayarının main branch → / (root) veya /docs klasörünü göstermesi gerekir. Script dosyayı başka bir yere yazıyorsa görünmez.

Settings → Pages → Source kısmını kontrol et.

3. Script hata veriyor ama "success" görünüyor
rapor_uret.py içinde try/except ile hataları yutuyorsa action yeşil görünür ama hiçbir şey yazılmaz. Actions logunda "Raporu üret" adımını genişletip çıktıya bakman gerekiyor.

4. GITHUB_TOKEN izni yetersiz
GITHUB_TOKEN'ın write yetkisi olmayabilir. Workflow'una şunu ekle:

yaml
jobs:
  rapor-uret:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ← Bu satır eksikse commit/push başarısız olur
