Hata 2: GitHub yazma hatasi: 403
Workflow'una permissions bloğu eksik. YAML dosyana şunu ekle:

yaml
jobs:
  rapor-uret:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # ← Bu satır eksikti
Ve commit/push adımı da yoksa onu da ekle (önceki mesajdaki blok).

Düzeltilmiş Tam Workflow
yaml
name: Günlük Rapor
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  rapor-uret:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # ← EKLENDİ

    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install requests

      - name: Raporu üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # Secret eklenince çalışır
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME:  ${{ github.event.repository.name }}
        run: python scripts/rapor_uret.py

      - name: Commit ve push                                     # ← EKLENDİ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Günlük rapor: $(date +'%Y-%m-%d')"
          git push
Özet — Yapılacaklar
#	Yapılacak	Nerede
1	ANTHROPIC_API_KEY secret'ı ekle	Repo → Settings → Secrets
2	permissions: contents: write ekle	Workflow YAML
3	Commit/push adımı ekle	Workflow YAML
Secret eklendikten sonra Actions → Run workflow ile manuel tetikle, log temiz çıkmalı.

