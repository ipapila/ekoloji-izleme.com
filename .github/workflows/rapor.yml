name: Günlük Rapor Üretimi

on:
  workflow_dispatch:       # Admin panelinden manuel tetikleme
  schedule:
    - cron: '0 7 * * *'   # Her gün 07:00 UTC = 10:00 Türkiye saati

jobs:
  rapor-uret:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # ── 1. Repo'yu çek ────────────────────────────────────────────
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      # ── 2. Python kur ─────────────────────────────────────────────
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: pip install requests

      # ── 3. Plesk'ten güncel veri dosyalarını çek ──────────────────
      - name: Güncel Verileri Plesk'ten İndir
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          BASE_URL=$(echo "${WEBHOOK_URL}" | sed 's|/webhook\.php.*||')
          for dosya in haberler.json ihlaller.json raporlar.json; do
            STATUS=$(curl -s -o "${dosya}" -w "%{http_code}" \
              --max-time 30 "${BASE_URL}/${dosya}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              KAYIT=$(python3 -c "
import json,sys
d=json.load(open('${dosya}'))
key=list(d.keys())
for k in key:
    if isinstance(d.get(k,[]),list): print(len(d[k])); sys.exit()
print('?')
" 2>/dev/null || echo "?")
              echo "✓ ${dosya}: ${KAYIT} kayıt"
            else
              echo "⚠ ${dosya} indirilemedi (HTTP ${STATUS})"
            fi
          done

      # ── 4. Raporu Üret ────────────────────────────────────────────
      - name: Günlük Raporu Üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python rapor_uret.py

      # ── 5. rapor.json'ı repo'ya commit et ────────────────────────
      - name: rapor.json Commit Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add rapor.json || true
          git diff --staged --quiet || git commit -m "Günlük Rapor: $(date +'%Y-%m-%d')"
          git push || true

      # ── 6. rapor.json Plesk'e Gönder ─────────────────────────────
      - name: rapor.json Plesk'e Gönder
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ ! -f "rapor.json" ]; then
            echo "⚠ rapor.json bulunamadı, atlanıyor."
            exit 0
          fi
          HTTP_STATUS=$(curl -s -o /tmp/webhook_yanit.txt -w "%{http_code}" \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
            --data-binary "@rapor.json" \
            "${WEBHOOK_URL}?dosya=rapor.json" 2>/dev/null || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ rapor.json Plesk'e gönderildi"
          else
            echo "⚠ Webhook HTTP ${HTTP_STATUS}: $(cat /tmp/webhook_yanit.txt 2>/dev/null)"
          fi
