name: Günlük Rapor Üretimi

on:
  workflow_dispatch:         # Admin panelinden manuel tetikleme
  schedule:
    - cron: '0 7 * * *'     # Her gün 07:00 UTC = 10:00 Türkiye saati

jobs:
  rapor-uret:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      # ── 1. Repo'yu çek ─────────────────────────────────────────
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      # ── 2. Python kur ──────────────────────────────────────────
      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: pip install requests

      # ── 3. Plesk'ten güncel veri dosyalarını indir ─────────────
      - name: Güncel Verileri Plesk'ten İndir
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          BASE_URL=$(echo "${WEBHOOK_URL}" | sed 's|/webhook\.php.*||')
          for dosya in haberler.json ihlaller.json raporlar.json; do
            STATUS=$(curl -s -o "${dosya}" -w "%{http_code}" \
              --max-time 30 "${BASE_URL}/${dosya}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ ${dosya} indirildi"
            else
              echo "⚠ ${dosya} indirilemedi (HTTP ${STATUS})"
            fi
          done

          # gunluk-raporlar.json arşivini de çek (varsa)
          STATUS=$(curl -s -o "gunluk-raporlar.json" -w "%{http_code}" \
            --max-time 30 "${BASE_URL}/gunluk-raporlar.json" 2>/dev/null || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✓ gunluk-raporlar.json indirildi"
          else
            echo "ℹ gunluk-raporlar.json henüz yok, sıfırdan oluşturulacak"
          fi

      # ── 4. Raporu Üret ─────────────────────────────────────────
      - name: Günlük Raporu Üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: python scripts/rapor_uret.py

      # ── 5. Üretilen dosyaları repo'ya commit et ────────────────
      - name: Değişiklikleri Commit Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add rapor.json gunluk-raporlar.json || true
          git diff --staged --quiet || git commit -m "Günlük Rapor: $(date +'%Y-%m-%d')"
          git push || true

      # ── 6. Her iki dosyayı Plesk'e gönder ─────────────────────
      - name: Dosyaları Plesk'e Gönder
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "WEBHOOK_URL tanımlı değil, Plesk adımı atlandı."
            exit 0
          fi

          for dosya in rapor.json gunluk-raporlar.json; do
            if [ ! -f "${dosya}" ]; then
              echo "⚠ ${dosya} bulunamadı, atlandı."
              continue
            fi
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              -X POST "${WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
              --data-binary "@${dosya}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ]; then
              echo "✓ ${dosya} Plesk'e gönderildi"
            else
              echo "⚠ ${dosya} Plesk gönderilemedi (HTTP ${STATUS})"
            fi
          done
