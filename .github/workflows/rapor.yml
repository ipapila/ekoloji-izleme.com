name: Günlük Rapor Üretimi

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  rapor-uret:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: pip install requests

      - name: Güncel Verileri Plesk'ten İndir
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          BASE_URL=$(echo "${WEBHOOK_URL}" | sed 's|/webhook.php.*||')
          for DOSYA in haberler.json ihlaller.json raporlar.json; do
            STATUS=$(curl -s -o "${DOSYA}" -w "%{http_code}" --max-time 30 "${BASE_URL}/${DOSYA}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ ${DOSYA} indirildi"
            else
              echo "⚠ ${DOSYA} indirilemedi (HTTP ${STATUS})"
              rm -f "${DOSYA}"
            fi
          done

      - name: Günlük Raporu Üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: python rapor_uret.py

      - name: rapor.json Commit Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add rapor.json || true
          git diff --staged --quiet || git commit -m "Gunluk Rapor: $(date +'%Y-%m-%d')"
          git push || true

      - name: rapor.json Plesk'e Gönder
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ ! -f "rapor.json" ]; then
            echo "rapor.json bulunamadi, atlaniyor."
            exit 0
          fi
          STATUS=$(curl -s -o /tmp/yanit.txt -w "%{http_code}" \
            --max-time 30 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
            --data-binary "@rapor.json" \
            "${WEBHOOK_URL}?dosya=rapor.json" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✓ rapor.json Plesk'e gönderildi"
          else
            echo "Webhook HTTP ${STATUS}"
            cat /tmp/yanit.txt || true
          fi
