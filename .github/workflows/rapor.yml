name: Günlük Rapor Üretimi

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

jobs:
  rapor-uret:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Repo Kodlarını Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: pip install requests

      # ── Plesk'ten güncel veri dosyalarını indir ─────────────────
      - name: Güncel Verileri Plesk'ten İndir
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          for dosya in haberler.json ihlaller.json raporlar.json gunluk-raporlar.json; do
            STATUS=$(curl -s -o "${dosya}" -w "%{http_code}" \
              --max-time 30 \
              -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
              "${WEBHOOK_URL}?dosya=${dosya}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ ${dosya} indirildi"
            elif [ "$STATUS" = "404" ]; then
              echo "ℹ ${dosya} henüz yok, sıfırdan oluşturulacak"
              rm -f "${dosya}"
            else
              echo "⚠ ${dosya} indirilemedi (HTTP ${STATUS})"
            fi
          done

      # ── Raporu Üret ─────────────────────────────────────────────
      - name: Günlük Raporu Üret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: python scripts/rapor_uret.py

      # ── Dosya kontrolü ──────────────────────────────────────────
      - name: Rapor Dosyası Kontrol Et
        run: |
          if [ ! -f "rapor.json" ]; then
            echo "HATA: rapor.json oluşturulmadı!"
            exit 1
          fi
          echo "✓ rapor.json ($(wc -c < rapor.json) byte)"
          if [ ! -f "gunluk-raporlar.json" ]; then
            echo "HATA: gunluk-raporlar.json oluşturulmadı!"
            exit 1
          fi
          echo "✓ gunluk-raporlar.json"

      # ── Repo'ya commit et ───────────────────────────────────────
      - name: Değişiklikleri Commit Et
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add rapor.json gunluk-raporlar.json
          git diff --staged --quiet \
            && echo "Değişiklik yok, commit atlandı." \
            || git commit -m "Günlük Rapor: $(date +'%Y-%m-%d')"
          git push || true

      # ── Dosyaları Plesk'e gönder ────────────────────────────────
      - name: Dosyaları Plesk'e Gönder
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "WEBHOOK_URL tanımlı değil, atlandı."
            exit 0
          fi
          for dosya in rapor.json gunluk-raporlar.json; do
            if [ ! -f "${dosya}" ]; then
              echo "⚠ ${dosya} bulunamadı, atlandı."
              continue
            fi
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 30 \
              -X POST "${WEBHOOK_URL}?dosya=${dosya}" \
              -H "Content-Type: application/json" \
              -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
              --data-binary "@${dosya}" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ]; then
              echo "✓ ${dosya} Plesk'e gönderildi"
            else
              echo "⚠ ${dosya} gönderilemedi (HTTP ${STATUS})"
            fi
          done
