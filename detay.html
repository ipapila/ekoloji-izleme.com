<!DOCTYPE html>
<html lang="tr">
<head>
	<!-- Google tag (gtag.js) -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detay — ekoloji-izleme.com</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.detay-wrap{max-width:860px;margin:0 auto;padding:100px 40px 80px;}
.detay-wrap.loading{opacity:.4;}

.breadcrumb{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:40px;}
.breadcrumb a{color:var(--muted);text-decoration:none;}
.breadcrumb a:hover{color:var(--cream);}
.breadcrumb span{margin:0 8px;}

.detay-kap{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;}
.detay-baslik{font-family:'Bebas Neue',sans-serif;font-size:clamp(34px,6vw,60px);line-height:1.05;color:var(--cream);margin-bottom:22px;}
.meta-row{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:40px;padding-bottom:28px;border-bottom:1px solid rgba(45,158,107,.15);}
.meta-item{display:flex;flex-direction:column;gap:3px;}
.meta-item .lbl{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.meta-item .val{font-size:13px;color:var(--cream);}

.detay-icerik{font-family:'Crimson Pro',serif;font-size:19px;line-height:1.72;color:rgba(240,235,220,.85);}
.detay-icerik p{margin-bottom:1.4em;}
.detay-icerik h2{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--cream);margin:2em 0 .8em;}

.kaynak-kutu{margin-top:48px;padding:22px 26px;background:var(--forest);border:1px solid rgba(45,158,107,.2);border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.kaynak-kutu .kk-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.kaynak-kutu .kk-val{font-size:14px;color:var(--cream);}
.kaynak-kutu a.kk-val{color:var(--bright);text-decoration:none;}
.kaynak-kutu a.kk-val:hover{text-decoration:underline;}

.pdf-frame-wrap{margin-top:36px;border-radius:6px;overflow:hidden;border:1px solid rgba(45,158,107,.2);}
.pdf-frame-wrap iframe{display:block;width:100%;height:680px;}

.nav-altbar{display:flex;gap:14px;margin-top:56px;padding-top:28px;border-top:1px solid rgba(45,158,107,.12);}

.badge-b{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:2px;}
.badge-b.kritik{background:rgba(232,92,42,.15);color:var(--warn);border:1px solid rgba(232,92,42,.25);}
.badge-b.orta{background:rgba(45,158,107,.12);color:var(--bright);border:1px solid rgba(45,158,107,.25);}
.badge-b.takipte{background:rgba(200,185,150,.08);color:var(--muted);border:1px solid rgba(200,185,150,.15);}
.badge-b.haber{background:rgba(45,158,107,.12);color:var(--bright);border:1px solid rgba(45,158,107,.25);}

.hata-kutu{text-align:center;padding:100px 40px;}
.hata-kutu h2{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--muted);margin-bottom:12px;}
.hata-kutu p{color:var(--muted);font-size:15px;}

.harita-mini{width:100%;height:280px;border-radius:6px;overflow:hidden;margin:32px 0;border:1px solid rgba(45,158,107,.15);}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<script src="site-data.js"></script>
<div id="nav-root"></div>
<script src="nav.js"></script>

<div class="detay-wrap" id="wrap">
  <div id="icerik"><!-- JS dolduracak --></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  await SITE.ready();
  render();
});

function render() {
  const hash = (location.hash || '').replace('#','');   // örn: "ihlal-42" | "haber-15" | "rapor-8"
  const match = hash.match(/^(ihlal|haber|rapor)-(.+)$/);

  if (!match) { showHata("Geçersiz bağlantı", "URL'de kayıt türü ve ID belirtilmedi."); return; }

  const [, tur, id] = match;
  const koleksiyon = { ihlal:'ihlaller', haber:'haberler', rapor:'raporlar' }[tur];
  const kayit = SITE.getById(koleksiyon, id);

  if (!kayit) { showHata("Kayıt bulunamadı", `#${id} numaralı ${tur} mevcut değil veya silindi.`); return; }

  if (tur === 'ihlal') renderIhlal(kayit);
  else if (tur === 'haber') renderHaber(kayit);
  else renderRapor(kayit);
}

/* ── İhlal ── */
function renderIhlal(k) {
  document.title = `${k.baslik} — ekoloji-izleme.com`;
  document.getElementById('icerik').innerHTML = `
    <div class="breadcrumb">
      <a href="./index.html">Ana Sayfa</a><span>›</span>
      <a href="./index.html#ihlaller">İhlaller</a><span>›</span>
      ${k.baslik.substring(0,60)}${k.baslik.length>60?'…':''}
    </div>

    <div class="detay-kap">${k.kategori}</div>
    <h1 class="detay-baslik">${k.baslik}</h1>

    <div class="meta-row">
      <div class="meta-item"><div class="lbl">Şiddet</div><div class="val"><span class="badge-b ${k.siddet}">${k.siddet}</span></div></div>
      <div class="meta-item"><div class="lbl">Konum</div><div class="val">${k.konum||'—'}</div></div>
      <div class="meta-item"><div class="lbl">Tarih</div><div class="val">${formatTarih(k.tarih)}</div></div>
      ${k.kaynak?`<div class="meta-item"><div class="lbl">Kaynak</div><div class="val">${k.kaynak}</div></div>`:''}
    </div>

    ${(k.lat && k.lng) ? `<div class="harita-mini" id="miniMap"></div>` : ''}

    <div class="detay-icerik">
      ${metin(k.aciklama || 'Bu ihlal için detaylı açıklama henüz eklenmemiş.')}
    </div>

    ${k.kaynak_url ? `
    <div class="kaynak-kutu">
      <div>
        <div class="kk-lbl">Kaynak</div>
        <a class="kk-val" href="${k.kaynak_url}" target="_blank" rel="noopener">${k.kaynak||k.kaynak_url} ↗</a>
      </div>
      <a class="btn btn-outline" href="${k.kaynak_url}" target="_blank" rel="noopener">Kaynağa Git →</a>
    </div>` : ''}

    <div class="nav-altbar">
      <a class="btn btn-outline" href="javascript:history.back()">← Geri</a>
      <button class="btn btn-outline" onclick="paylas()">Paylaş</button>
    </div>
  `;

  if (k.lat && k.lng) initMiniMap(k.lat, k.lng, k.baslik, k.kategori);
}

/* ── Haber ── */
function renderHaber(k) {
  document.title = `${k.baslik} — ekoloji-izleme.com`;
  document.getElementById('icerik').innerHTML = `
    <div class="breadcrumb">
      <a href="./index.html">Ana Sayfa</a><span>›</span>
      <a href="./haberler.html">Haberler</a><span>›</span>
      ${k.baslik.substring(0,60)}${k.baslik.length>60?'…':''}
    </div>

    <div class="detay-kap"><span class="badge-b haber">${k.etiket||'Haber'}</span></div>
    <h1 class="detay-baslik">${k.baslik}</h1>

    <div class="meta-row">
      <div class="meta-item"><div class="lbl">Tarih</div><div class="val">${formatTarih(k.tarih)}</div></div>
      ${k.kaynak?`<div class="meta-item"><div class="lbl">Kaynak</div><div class="val">${k.kaynak}</div></div>`:''}
    </div>

    <div class="detay-icerik">
      ${metin(k.ozet || k.icerik || 'İçerik yükleniyor…')}
    </div>

    ${k.url ? `
    <div class="kaynak-kutu">
      <div>
        <div class="kk-lbl">Orijinal Haber</div>
        <a class="kk-val" href="${k.url}" target="_blank" rel="noopener">${k.kaynak||k.url} ↗</a>
      </div>
      <a class="btn btn-primary" href="${k.url}" target="_blank" rel="noopener">Habere Git →</a>
    </div>` : ''}

    <div class="nav-altbar">
      <a class="btn btn-outline" href="javascript:history.back()">← Geri</a>
      <button class="btn btn-outline" onclick="paylas()">Paylaş</button>
    </div>
  `;
}

/* ── Rapor ── */
function renderRapor(k) {
  document.title = `${k.baslik} — ekoloji-izleme.com`;
  const hasPdf = k.dosya && (k.dosya.endsWith('.pdf') || k.dosya.includes('.pdf'));

  document.getElementById('icerik').innerHTML = `
    <div class="breadcrumb">
      <a href="./index.html">Ana Sayfa</a><span>›</span>
      <a href="./raporlar.html">Raporlar</a><span>›</span>
      ${k.baslik.substring(0,60)}${k.baslik.length>60?'…':''}
    </div>

    <div class="detay-kap"><span class="badge-b haber">${k.etiket||'Rapor'}</span> · ${k.yil||'—'}</div>
    <h1 class="detay-baslik">${k.baslik}</h1>

    <div class="meta-row">
      <div class="meta-item"><div class="lbl">Yıl</div><div class="val">${k.yil||'—'}</div></div>
      <div class="meta-item"><div class="lbl">Kategori</div><div class="val">${k.etiket||'—'}</div></div>
      ${k.yazar?`<div class="meta-item"><div class="lbl">Yazar / Kurum</div><div class="val">${k.yazar}</div></div>`:''}
    </div>

    <div class="detay-icerik">
      ${metin(k.ozet || '')}
    </div>

    ${hasPdf ? `
    <div class="pdf-frame-wrap">
      <iframe src="${k.dosya}" title="${k.baslik}"></iframe>
    </div>` : ''}

    ${k.dosya ? `
    <div class="kaynak-kutu">
      <div>
        <div class="kk-lbl">Dosya</div>
        <a class="kk-val" href="${k.dosya}" target="_blank" rel="noopener">${hasPdf ? 'PDF belgesi' : 'Dosyayı aç'} ↗</a>
      </div>
      <a class="btn btn-primary" href="${k.dosya}" target="_blank" rel="noopener" download>İndir ↓</a>
    </div>` : ''}

    <div class="nav-altbar">
      <a class="btn btn-outline" href="javascript:history.back()">← Geri</a>
      <button class="btn btn-outline" onclick="paylas()">Paylaş</button>
    </div>
  `;
}

/* ── Yardımcılar ── */
function showHata(baslik, msg) {
  document.getElementById('icerik').innerHTML = `
    <div class="hata-kutu">
      <h2>${baslik}</h2>
      <p>${msg}</p>
      <a class="btn btn-outline" href="./index.html" style="margin-top:24px;">← Ana Sayfaya Dön</a>
    </div>`;
}

function metin(str) {
  if (!str) return '';
  return str.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
}

function formatTarih(t) {
  if (!t) return '—';
  const d = new Date(t);
  if (isNaN(d)) return t;
  return d.toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'});
}

function paylas() {
  if (navigator.share) {
    navigator.share({ title: document.title, url: location.href });
  } else {
    navigator.clipboard.writeText(location.href).then(() => alert('Bağlantı kopyalandı.'));
  }
}

function initMiniMap(lat, lng, baslik, kategori) {
  const RENKLER = {
    "Maden":"#7f8c8d","Orman":"#16a085","Su Kirliliği":"#2980b9",
    "HES":"#3498db","RES":"#1abc9c","Kıyı":"#c0392b",
    "Tarım Arazisi":"#f39c12","Atık":"#e74c3c","Sanayi":"#2c3e50",
    "Kaçak Yapı":"#9b59b6","Termik":"#d35400"
  };
  const renk = RENKLER[kategori] || '#2d9e6b';

  const map = L.map('miniMap', { zoomControl:true, scrollWheelZoom:false })
    .setView([lat, lng], 11);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution:'© OpenStreetMap', maxZoom:18
  }).addTo(map);

  const icon = L.divIcon({
    className:'',
    html:`<div style="width:14px;height:14px;border-radius:50%;background:${renk};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);"></div>`,
    iconSize:[14,14], iconAnchor:[7,7]
  });

  L.marker([lat, lng], {icon}).addTo(map).bindPopup(baslik).openPopup();
}
</script>
</body>
</html>
