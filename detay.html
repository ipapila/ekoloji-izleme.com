<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detay — ekoloji-izleme.com</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.detay-wrap{max-width:860px;margin:0 auto;padding:100px 40px 80px;}

.breadcrumb{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:40px;}
.breadcrumb a{color:var(--muted);text-decoration:none;}
.breadcrumb a:hover{color:var(--cream);}
.breadcrumb span{margin:0 8px;}

.detay-kap{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.detay-baslik{font-family:'Bebas Neue',sans-serif;font-size:clamp(34px,6vw,60px);line-height:1.05;color:var(--cream);margin-bottom:22px;}
.meta-row{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:24px;padding-bottom:22px;border-bottom:1px solid rgba(45,158,107,.15);}
.meta-item{display:flex;flex-direction:column;gap:3px;}
.meta-item .lbl{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
.meta-item .val{font-size:13px;color:var(--cream);}

/* Etiket chips */
.etiket-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:28px;}
.etiket-chip{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:2px;background:rgba(45,158,107,.1);border:1px solid rgba(45,158,107,.2);color:var(--bright);}
.eylem-badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 11px;border-radius:2px;background:rgba(240,165,0,.12);color:var(--alert);border:1px solid rgba(240,165,0,.25);}

/* Hero fotoğraf */
.hero-foto{width:100%;max-height:420px;object-fit:cover;border-radius:6px;margin-bottom:32px;border:1px solid rgba(45,158,107,.15);display:block;}

/* İçerik */
.detay-icerik{font-family:'Crimson Pro',serif;font-size:19px;line-height:1.72;color:rgba(240,235,220,.85);}
.detay-icerik p{margin-bottom:1.4em;}
.detay-icerik h2{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--cream);margin:2em 0 .8em;}

/* Kaynak kutusu */
.kaynak-kutu{margin-top:32px;padding:20px 24px;background:var(--forest);border:1px solid rgba(45,158,107,.2);border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.kaynak-kutu .kk-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.kaynak-kutu .kk-val{font-size:14px;color:var(--cream);}
.kaynak-kutu a.kk-val{color:var(--bright);text-decoration:none;}
.kaynak-kutu a.kk-val:hover{text-decoration:underline;}

/* PDF/Dosya */
.pdf-frame-wrap{margin-top:28px;border-radius:6px;overflow:hidden;border:1px solid rgba(45,158,107,.2);}
.pdf-frame-wrap iframe{display:block;width:100%;height:680px;}
.dosya-kutu{margin-top:12px;padding:16px 22px;background:var(--forest);border:1px solid rgba(45,158,107,.15);border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.dosya-kutu .dk-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
.dosya-kutu .dk-val{font-size:13px;color:var(--bright);text-decoration:none;}
.dosya-kutu .dk-val:hover{text-decoration:underline;}

/* Alt bar */
.nav-altbar{display:flex;gap:14px;margin-top:48px;padding-top:24px;border-top:1px solid rgba(45,158,107,.12);}

/* Badge */
.badge-b{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:2px;}
.badge-b.kritik{background:rgba(232,92,42,.15);color:var(--warn);border:1px solid rgba(232,92,42,.25);}
.badge-b.orta{background:rgba(45,158,107,.12);color:var(--bright);border:1px solid rgba(45,158,107,.25);}
.badge-b.takipte{background:rgba(200,185,150,.08);color:var(--muted);border:1px solid rgba(200,185,150,.15);}
.badge-b.haber,.badge-b.makale,.badge-b.rapor{background:rgba(45,158,107,.12);color:var(--bright);border:1px solid rgba(45,158,107,.25);}

/* Mini harita */
.harita-mini{width:100%;height:280px;border-radius:6px;overflow:hidden;margin:28px 0;border:1px solid rgba(45,158,107,.15);}

/* Hata */
.hata-kutu{text-align:center;padding:100px 40px;}
.hata-kutu h2{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--muted);margin-bottom:12px;}
.hata-kutu p{color:var(--muted);font-size:15px;}

@media(max-width:640px){
  .detay-wrap{padding:80px 20px 60px;}
  .pdf-frame-wrap iframe{height:420px;}
}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<script src="site-data.js"></script>
<div id="nav-root"></div>
<script src="nav.js"></script>

<div class="detay-wrap" id="wrap">
  <div id="icerik"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (typeof SITE !== 'undefined' && SITE.ready) await SITE.ready();
  render();
});

function render() {
  const hash  = (location.hash || '').replace('#', '');
  const match = hash.match(/^(ihlal|haber|rapor|makale)-(.+)$/);
  if (!match) { showHata('Geçersiz bağlantı', 'URL\'de kayıt türü ve ID belirtilmedi.'); return; }

  const [, tur, id] = match;
  const kol = { ihlal: 'ihlaller', haber: 'haberler', rapor: 'raporlar', makale: 'makaleler' }[tur];
  const kayit = SITE.getById(kol, id);
  if (!kayit) { showHata('Kayıt bulunamadı', `#${id} numaralı ${tur} mevcut değil veya silindi.`); return; }

  if (tur === 'ihlal')   renderIhlal(kayit);
  else if (tur === 'haber')  renderHaber(kayit);
  else if (tur === 'rapor')  renderRapor(kayit);
  else                       renderMakale(kayit);
}

/* ─── İHLAL ─── */
function renderIhlal(k) {
  document.title = `${k.baslik} — ekoloji-izleme.com`;
  document.getElementById('icerik').innerHTML = `
    ${breadcrumb([['./index.html','Ana Sayfa'],['./ihlaller.html','İhlaller']], k.baslik)}
    ${k.foto_url ? `<img class="hero-foto" src="${k.foto_url}" alt="${k.baslik}" onerror="this.style.display='none'">` : ''}
    <div class="detay-kap">
      <span>${k.kategori || ''}</span>
      <span class="badge-b ${k.siddet}">${k.siddet || ''}</span>
    </div>
    <h1 class="detay-baslik">${k.baslik}</h1>
    <div class="meta-row">
      ${metaItem('Konum', k.konum)}
      ${metaItem('Tarih', formatTarih(k.tarih))}
      ${k.kaynak ? metaItem('Kaynak', k.kaynak) : ''}
      ${k.lat && k.lng ? metaItem('Koordinat', `${parseFloat(k.lat).toFixed(4)}, ${parseFloat(k.lng).toFixed(4)}`) : ''}
    </div>
    ${k.lat && k.lng ? `<div class="harita-mini" id="miniMap"></div>` : ''}
    <div class="detay-icerik">
      ${metin(k.aciklama || 'Bu ihlal için detaylı açıklama henüz eklenmemiş.')}
    </div>
    ${k.kaynak_url ? kaynakKutu(k.kaynak || k.kaynak_url, k.kaynak_url, 'Kaynağa Git →') : ''}
    ${navAltbar()}
  `;
  if (k.lat && k.lng) initMiniMap(k.lat, k.lng, k.baslik, k.kategori);
}

/* ─── HABER ─── */
function renderHaber(k) {
  document.title = `${k.baslik} — ekoloji-izleme.com`;
  const etiketler = parseEtiketler(k.etiketler);
  document.getElementById('icerik').innerHTML = `
    ${breadcrumb([['./index.html','Ana Sayfa'],['./haberler.html','Haberler']], k.baslik)}
    ${k.foto_url ? `<img class="hero-foto" src="${k.foto_url}" alt="${k.baslik}" onerror="this.style.display='none'">` : ''}
    <div class="detay-kap">
      <span class="badge-b haber">${k.etiket || 'Haber'}</span>
      ${k.eylem ? `<span class="eylem-badge">${k.eylem}</span>` : ''}
    </div>
    <h1 class="detay-baslik">${k.baslik}</h1>
    <div class="meta-row">
      ${metaItem('Tarih', formatTarih(k.tarih))}
      ${k.kaynak ? metaItem('Kaynak', k.kaynak) : ''}
    </div>
    ${etiketler.length ? `<div class="etiket-row">${etiketler.map(e=>`<span class="etiket-chip">${e}</span>`).join('')}</div>` : ''}
    <div class="detay-icerik">
      ${metin(k.ozet || k.icerik || 'İçerik yükleniyor…')}
    </div>
    ${k.url ? kaynakKutu(k.kaynak || k.url, k.url, 'Habere Git →') : ''}
    ${navAltbar()}
  `;
}

/* ─── RAPOR ─── */
function renderRapor(k) {
  document.title = `${k.baslik} — ekoloji-izleme.com`;
  const etiketler = parseEtiketler(k.etiketler);
  const hasPdf = k.dosya && /\.pdf(\?|$)/i.test(k.dosya);
  const hasDoc = k.dosya && /\.(doc|docx)(\?|$)/i.test(k.dosya);
  const dosyaAd = hasPdf ? 'PDF Belgesi' : hasDoc ? 'Word Belgesi' : k.dosya ? 'Dosya' : '';

  document.getElementById('icerik').innerHTML = `
    ${breadcrumb([['./index.html','Ana Sayfa'],['./raporlar.html','Raporlar']], k.baslik)}
    ${k.foto_url ? `<img class="hero-foto" src="${k.foto_url}" alt="${k.baslik}" onerror="this.style.display='none'">` : ''}
    <div class="detay-kap">
      <span class="badge-b rapor">${k.tur || k.kategori || 'Rapor'}</span>
      ${k.yil ? `<span>${k.yil}</span>` : ''}
    </div>
    <h1 class="detay-baslik">${k.baslik}</h1>
    <div class="meta-row">
      ${k.yil   ? metaItem('Yıl', k.yil) : ''}
      ${k.yazar ? metaItem('Yazar / Kurum', k.yazar) : ''}
      ${k.tur   ? metaItem('Tür', k.tur) : ''}
      ${k.tarih ? metaItem('Tarih', formatTarih(k.tarih)) : ''}
    </div>
    ${etiketler.length ? `<div class="etiket-row">${etiketler.map(e=>`<span class="etiket-chip">${e}</span>`).join('')}</div>` : ''}
    <div class="detay-icerik">
      ${metin(k.ozet || k.aciklama || '')}
    </div>
    ${hasPdf ? `<div class="pdf-frame-wrap"><iframe src="${k.dosya}" title="${k.baslik}"></iframe></div>` : ''}
    ${k.dosya ? `
      <div class="dosya-kutu">
        <div>
          <div class="dk-lbl">${dosyaAd}</div>
          <a class="dk-val" href="${k.dosya}" target="_blank" rel="noopener">${k.dosya.split('/').pop()} ↗</a>
        </div>
        <a class="btn btn-primary" href="${k.dosya}" target="_blank" rel="noopener" download>İndir ↓</a>
      </div>` : ''}
    ${(k.url || k.kaynak_url) ? kaynakKutu(k.kaynak || (k.url || k.kaynak_url), k.url || k.kaynak_url, 'Kaynağa Git →') : ''}
    ${navAltbar()}
  `;
}

/* ─── MAKALE ─── */
function renderMakale(k) {
  document.title = `${k.baslik} — ekoloji-izleme.com`;
  const etiketler = parseEtiketler(k.etiketler);
  document.getElementById('icerik').innerHTML = `
    ${breadcrumb([['./index.html','Ana Sayfa'],['./makaleler.html','Makaleler']], k.baslik)}
    ${k.foto_url ? `<img class="hero-foto" src="${k.foto_url}" alt="${k.baslik}" onerror="this.style.display='none'">` : ''}
    <div class="detay-kap">
      <span class="badge-b makale">${k.tur || 'Makale'}</span>
    </div>
    <h1 class="detay-baslik">${k.baslik}</h1>
    <div class="meta-row">
      ${k.yazar ? metaItem('Yazar / Kurum', k.yazar) : ''}
      ${metaItem('Tarih', formatTarih(k.tarih))}
      ${k.tur   ? metaItem('Tür', k.tur) : ''}
    </div>
    ${etiketler.length ? `<div class="etiket-row">${etiketler.map(e=>`<span class="etiket-chip">${e}</span>`).join('')}</div>` : ''}
    <div class="detay-icerik">
      ${metin(k.ozet || k.icerik || 'İçerik mevcut değil.')}
    </div>
    ${k.url ? kaynakKutu(k.kaynak || k.url, k.url, 'Makaleye Git →') : ''}
    ${navAltbar()}
  `;
}

/* ─── YARDIMCILAR ─── */
function showHata(baslik, msg) {
  document.getElementById('icerik').innerHTML = `
    <div class="hata-kutu">
      <h2>${baslik}</h2>
      <p>${msg}</p>
      <a class="btn btn-outline" href="./index.html" style="margin-top:24px;">← Ana Sayfaya Dön</a>
    </div>`;
}

function breadcrumb(links, son) {
  const parts = links.map(([href,ad])=>`<a href="${href}">${ad}</a>`).join('<span>›</span>');
  const sonKes = son.length > 55 ? son.substring(0, 55) + '…' : son;
  return `<div class="breadcrumb">${parts}<span>›</span>${sonKes}</div>`;
}

function metaItem(lbl, val) {
  if (!val || val === '—') return '';
  return `<div class="meta-item"><div class="lbl">${lbl}</div><div class="val">${val}</div></div>`;
}

function kaynakKutu(ad, url, btnMetin) {
  let domain = url;
  try { domain = new URL(url).hostname.replace('www.', ''); } catch(e) {}
  return `<div class="kaynak-kutu">
    <div>
      <div class="kk-lbl">Kaynak</div>
      <a class="kk-val" href="${url}" target="_blank" rel="noopener">${ad || domain} ↗</a>
    </div>
    <a class="btn btn-primary" href="${url}" target="_blank" rel="noopener">${btnMetin}</a>
  </div>`;
}

function navAltbar() {
  return `<div class="nav-altbar">
    <a class="btn btn-outline" href="javascript:history.back()">← Geri</a>
    <button class="btn btn-outline" onclick="paylas()">Paylaş</button>
  </div>`;
}

function parseEtiketler(e) {
  if (!e) return [];
  if (Array.isArray(e)) return e.filter(Boolean);
  try { const p = JSON.parse(e); return Array.isArray(p) ? p.filter(Boolean) : []; } catch { return []; }
}

function metin(str) {
  if (!str) return '';
  return str.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
}

function formatTarih(t) {
  if (!t) return '—';
  const d = new Date(t);
  if (isNaN(d)) return t;
  return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });
}

function paylas() {
  if (navigator.share) {
    navigator.share({ title: document.title, url: location.href });
  } else {
    navigator.clipboard.writeText(location.href).then(() => alert('Bağlantı kopyalandı.'));
  }
}

function initMiniMap(lat, lng, baslik, kategori) {
  const RENKLER = {
    'Maden': '#7f8c8d', 'Orman Alanı': '#16a085', 'Su Ekosistemleri': '#2980b9',
    'HES': '#3498db', 'RES': '#1abc9c', 'Kıyı İhlalleri': '#c0392b',
    'Tarım Arazisi İhlali': '#f39c12', 'Atık & Depolama': '#e74c3c',
    'Sanayi Bölgesi': '#2c3e50', 'Kaçak Yapılaşma': '#9b59b6', 'Termik Reaktör': '#d35400'
  };
  const renk = RENKLER[kategori] || '#2d9e6b';
  const map = L.map('miniMap', { zoomControl: true, scrollWheelZoom: false })
    .setView([lat, lng], 11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 19
  }).addTo(map);
  const icon = L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${renk};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);"></div>`,
    iconSize: [14, 14], iconAnchor: [7, 7]
  });
  L.marker([lat, lng], { icon }).addTo(map).bindPopup(baslik).openPopup();
}
</script>
</body>
</html>
